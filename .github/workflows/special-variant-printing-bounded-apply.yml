name: Special Variant Printing Bounded Apply

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Governed write or reconciliation scope
        required: true
        type: choice
        options:
          - first_25
          - remaining_118
          - full_reconcile
      approval_phrase:
        description: Enter APPLY_SPECIAL_VARIANT_PRINTINGS_V1 for write scopes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: special-variant-printing-bounded-apply-v1
  cancel-in-progress: false

jobs:
  bounded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MANIFEST_FINGERPRINT: 2437a727bf53ba62752067b55eddacbfc4a99f98e3564e11ce5b5d1c8a306c9c
      APPLY_VERSION: SPECIAL_VARIANT_PRINTING_BOUNDED_APPLY_V1
      SPECIAL_VARIANT_PRINTING_OUTPUT_DIR: docs/audits/special_variant_printing_authority_v1/bounded_apply_runs

    steps:
      - name: Check out frozen workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          if [[ "${{ inputs.scope }}" != "full_reconcile" ]]; then
            test "${{ inputs.approval_phrase }}" = "APPLY_SPECIAL_VARIANT_PRINTINGS_V1"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify bounded apply contracts
        run: |
          node --check scripts/audits/special_variant_printing_bounded_apply_v1.mjs
          node --test \
            tests/contracts/special_variant_printing_authority_v1.test.mjs \
            tests/contracts/special_variant_printing_guarded_manifest_v1.test.mjs \
            tests/contracts/special_variant_printing_transactional_rollback_v1.test.mjs \
            tests/contracts/special_variant_printing_bounded_apply_v1.test.mjs

      - name: Execute governed scope
        id: governed
        shell: bash
        env:
          SPECIAL_VARIANT_PRINTING_EXPECTED_SHA: ${{ github.sha }}
          SPECIAL_VARIANT_PRINTING_EXPECTED_MANIFEST_FINGERPRINT: ${{ env.MANIFEST_FINGERPRINT }}
        run: |
          set -euo pipefail
          run_apply() {
            local offset="$1"
            local size="$2"
            SPECIAL_VARIANT_PRINTING_APPLY_APPROVAL="${APPLY_VERSION}:${MANIFEST_FINGERPRINT}:${offset}:${size}" \
              node scripts/audits/special_variant_printing_bounded_apply_v1.mjs \
                --apply \
                "--batch-offset=${offset}" \
                "--batch-size=${size}"
          }

          case "${{ inputs.scope }}" in
            first_25)
              run_apply 0 25
              ;;
            remaining_118)
              node scripts/audits/special_variant_printing_bounded_apply_v1.mjs \
                --reconcile-only --batch-offset=0 --batch-size=25
              run_apply 25 25
              run_apply 50 25
              run_apply 75 25
              run_apply 100 25
              run_apply 125 18
              ;;
            full_reconcile)
              node scripts/audits/special_variant_printing_bounded_apply_v1.mjs \
                --reconcile-only --batch-offset=0 --batch-size=143
              ;;
            *)
              echo "Unknown scope" >&2
              exit 1
              ;;
          esac

      - name: Record runner metadata
        if: ${{ always() }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const output = {
            version: 'SPECIAL_VARIANT_PRINTING_BOUNDED_APPLY_GITHUB_METADATA_V1',
            generated_at: new Date().toISOString(),
            github_sha: process.env.GITHUB_SHA,
            github_ref: process.env.GITHUB_REF,
            github_run_id: process.env.GITHUB_RUN_ID,
            github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: '${{ inputs.scope }}',
            governed_step_outcome: '${{ steps.governed.outcome }}',
            workflow: process.env.GITHUB_WORKFLOW,
            manifest_fingerprint_sha256: process.env.MANIFEST_FINGERPRINT,
            approvals_performed: false,
            public_visibility_changed: false
          };
          const directory = process.env.SPECIAL_VARIANT_PRINTING_OUTPUT_DIR;
          await fs.mkdir(directory, { recursive: true });
          await fs.writeFile(
            path.join(directory, `github_runner_${process.env.GITHUB_RUN_ID}.json`),
            `${JSON.stringify(output, null, 2)}\n`
          );
          NODE

      - name: Upload bounded apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: special-variant-printing-${{ inputs.scope }}-${{ github.run_id }}
          path: docs/audits/special_variant_printing_authority_v1/bounded_apply_runs
          if-no-files-found: error
          retention-days: 90
