name: Japanese V4 Image Pointer Approved Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/japanese-v4-image-pointer-approved-apply.yml
      - scripts/audits/japanese_master_index_v4/image_pointer_apply_db_v1.mjs
      - scripts/audits/japanese_master_index_v4/image_pointer_apply_v1.mjs

permissions:
  contents: read

concurrency:
  group: japanese-v4-image-pointer-approved-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'catalog/jpn-v4-production-integration-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify frozen apply implementation
        shell: bash
        run: |
          test "$(sha256sum scripts/audits/japanese_master_index_v4/image_pointer_apply_db_v1.mjs | cut -d' ' -f1)" = '5af461261264dd78d55b8bcc66dee0decab71fe71964e86530fde907d7bb4c69'
          test "$(sha256sum scripts/audits/japanese_master_index_v4/image_pointer_apply_v1.mjs | cut -d' ' -f1)" = '5e5dac562334057e81611c12807de3534ea423cfb3e5ecb769cb38a275569d32'

      - name: Run exact approved durable apply
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$SUPABASE_DB_URL"
          node scripts/audits/japanese_master_index_v4/image_pointer_apply_v1.mjs \
            --apply \
            --fingerprint='e76ecd6f12ad5c1a1a1f6836d54c34d527e4688f43d5196331aed31da93df912' \
            --pointer-plan-hash='0600e0de392dcf714b5a3450a6f05fd739e6b32092e9e46883c747c56bacf5be' \
            --mutation-contract-hash='5f103aaabda1f04533426e6695b367460c29483e694b5909e233c6529778e6f9' \
            --rollback-proof-hash='ce3dbf33ba7d1cdb247269a8081ac1f31e0572fdfbf5a1322271baa36bcbe185'

      - name: Upload durable apply proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-v4-image-pointer-approved-apply
          path: docs/audits/japanese_master_index_v4/image_pointer_apply_v1/
          if-no-files-found: error
          retention-days: 30
