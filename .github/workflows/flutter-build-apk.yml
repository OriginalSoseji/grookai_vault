name: Flutter Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: Android versionCode; must be greater than the pubspec baseline.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MOBILE_SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
      MOBILE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            MOBILE_SUPABASE_URL
            MOBILE_SUPABASE_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for signed Android release artifacts."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub --concurrency=4 --exclude-tags golden

      - name: Build signed release APK
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER_ARGS=()
          if [[ -n "$REQUESTED_BUILD_NUMBER" ]]; then
            if [[ ! "$REQUESTED_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "build_number must contain digits only."
              exit 1
            fi
            BASE_BUILD_NUMBER="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' pubspec.yaml)"
            if [[ -z "$BASE_BUILD_NUMBER" ]] || (( REQUESTED_BUILD_NUMBER <= BASE_BUILD_NUMBER )); then
              echo "build_number must exceed the pubspec baseline."
              exit 1
            fi
            BUILD_NUMBER_ARGS+=("--build-number=$REQUESTED_BUILD_NUMBER")
          fi
          flutter build apk --release \
            "${BUILD_NUMBER_ARGS[@]}" \
            --dart-define=SUPABASE_URL="$MOBILE_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$MOBILE_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=MTG_SEALED_CLIENT_V1_ENABLED="${{ vars.MTG_SEALED_CLIENT_V1_ENABLED || 'false' }}" \
            --dart-define=POKEMON_SEALED_CLIENT_V1_ENABLED="${{ vars.POKEMON_SEALED_CLIENT_V1_ENABLED || 'false' }}" \
            --dart-define=SEALED_OWNERSHIP_V1_ENABLED="${{ vars.SEALED_OWNERSHIP_V1_ENABLED || 'false' }}"

      - name: Record and verify Android release identity
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "Android build-tools did not provide aapt."; exit 1; }
          test -n "$APKSIGNER" || { echo "Android build-tools did not provide apksigner."; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_ID="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<<"$BADGING")"
          VERSION_NAME="$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<<"$BADGING")"
          VERSION_CODE="$(sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" <<<"$BADGING")"
          BASE_BUILD_NUMBER="$(sed -nE 's/^version: ([^+]+)\+([0-9]+)$/\2/p' pubspec.yaml)"
          EXPECTED_BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-$BASE_BUILD_NUMBER}"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          SIGNER_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | tr -d '\r' | awk 'tolower($0) ~ /sha-256 digest:/ { sub(/^.*digest:[[:space:]]*/, ""); gsub(/[^[:xdigit:]]/, ""); print tolower($0); exit }')"
          printf 'Android APK identity: package=%s version_name=%s version_code=%s expected_build=%s signer_sha256=%s\n' \
            "${PACKAGE_ID:-missing}" "${VERSION_NAME:-missing}" "${VERSION_CODE:-missing}" \
            "${EXPECTED_BUILD_NUMBER:-missing}" "${SIGNER_SHA256:-missing}"
          test "$PACKAGE_ID" = "com.grookai.vault" || { echo "Unexpected Android package ID: ${PACKAGE_ID:-missing}"; exit 1; }
          test "$VERSION_CODE" = "$EXPECTED_BUILD_NUMBER" || { echo "APK build number ${VERSION_CODE:-missing} does not match expected $EXPECTED_BUILD_NUMBER."; exit 1; }
          test "$VERSION_NAME" = "1.0.0" || { echo "Unexpected Android marketing version: ${VERSION_NAME:-missing}"; exit 1; }
          if [[ "${#SIGNER_SHA256}" -ne 64 ]]; then
            printf 'apksigner report for diagnosis:\n%s\n' "$SIGNATURE_OUTPUT"
            echo "APK signer fingerprint was missing or malformed."
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({schema:"MOBILE_RELEASE_ARTIFACT_V1",platform:"android",package_id:process.argv[2],marketing_version:process.argv[3],build_number:process.argv[4],source_commit:process.argv[5],signer_sha256:process.argv[6]},null,2)+"\n")' \
            build/app/outputs/flutter-apk/mobile-release-manifest.json \
            "$PACKAGE_ID" "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" "$SIGNER_SHA256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/mobile-release-manifest.json

  golden-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify renderer goldens
        run: >-
          flutter test --no-pub
          test/grookai_objects/grookai_object_renderer_golden_test.dart
