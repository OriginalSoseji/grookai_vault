name: Flutter Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: Android versionCode; must be greater than the pubspec baseline.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MOBILE_SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
      MOBILE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            MOBILE_SUPABASE_URL
            MOBILE_SUPABASE_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for signed Android release artifacts."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub --concurrency=4 --exclude-tags golden

      - name: Build signed release APK
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER_ARGS=()
          if [[ -n "$REQUESTED_BUILD_NUMBER" ]]; then
            if [[ ! "$REQUESTED_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "build_number must contain digits only."
              exit 1
            fi
            BASE_BUILD_NUMBER="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' pubspec.yaml)"
            if [[ -z "$BASE_BUILD_NUMBER" ]] || (( REQUESTED_BUILD_NUMBER <= BASE_BUILD_NUMBER )); then
              echo "build_number must exceed the pubspec baseline."
              exit 1
            fi
            BUILD_NUMBER_ARGS+=("--build-number=$REQUESTED_BUILD_NUMBER")
          fi
          flutter build apk --release \
            "${BUILD_NUMBER_ARGS[@]}" \
            --dart-define=SUPABASE_URL="$MOBILE_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$MOBILE_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=MTG_SEALED_CLIENT_V1_ENABLED="${{ vars.MTG_SEALED_CLIENT_V1_ENABLED || 'false' }}" \
            --dart-define=POKEMON_SEALED_CLIENT_V1_ENABLED="${{ vars.POKEMON_SEALED_CLIENT_V1_ENABLED || 'false' }}" \
            --dart-define=SEALED_OWNERSHIP_V1_ENABLED="${{ vars.SEALED_OWNERSHIP_V1_ENABLED || 'false' }}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  golden-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify renderer goldens
        run: >-
          flutter test --no-pub
          test/grookai_objects/grookai_object_renderer_golden_test.dart
