name: Pokemon Master Index Refresh

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pokemon-master-index-refresh-v1
  cancel-in-progress: false

jobs:
  refresh-english:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CATALOG_AUTOMATION_MODE: shadow-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify refresh contracts
        run: |
          node --check scripts/audits/verified_master_set_index_v1_build_english_master_index.mjs
          node --check scripts/workers/english_pokemon_master_index_refresh_v1.mjs
          node --check scripts/workers/pokemon_language_master_index_refresh_v1.mjs
          node --check scripts/workers/japanese_pokemon_master_index_incremental_refresh_v1.mjs
          node --check scripts/workers/universal_catalog_discovery_v1.mjs
          node --test \
            tests/contracts/english_master_index_human_fixtures_v1.test.mjs \
            tests/contracts/english_pokemon_master_index_refresh_v1.test.mjs \
            tests/contracts/pokemon_language_master_index_v1.test.mjs \
            tests/contracts/japanese_pokemon_master_index_incremental_v1.test.mjs

      - name: Initialize refresh evidence
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$RUNNER_TEMP/english-master-index-candidate"
          REPORT_DIR="$RUNNER_TEMP/english-master-index-refresh-report"
          LANGUAGE_REPORT_DIR="$RUNNER_TEMP/pokemon-language-master-index-report"
          DISCOVERY_DIR="$RUNNER_TEMP/pokemon-language-master-index-discovery"
          JAPANESE_REPORT_DIR="$RUNNER_TEMP/japanese-master-index-incremental-report"
          BASELINE_DIR="docs/audits/verified_master_set_index_v1/english_master_index_v1"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          CHECKED_OUT_BRANCH="$(git branch --show-current)"
          CHECKED_OUT_BRANCH="${CHECKED_OUT_BRANCH:-$DEFAULT_BRANCH}"
          mkdir -p \
            "$CANDIDATE_DIR" \
            "$REPORT_DIR" \
            "$LANGUAGE_REPORT_DIR" \
            "$DISCOVERY_DIR" \
            "$JAPANESE_REPORT_DIR"
          echo "CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          echo "LANGUAGE_REPORT_DIR=$LANGUAGE_REPORT_DIR" >> "$GITHUB_ENV"
          echo "DISCOVERY_DIR=$DISCOVERY_DIR" >> "$GITHUB_ENV"
          echo "JAPANESE_REPORT_DIR=$JAPANESE_REPORT_DIR" >> "$GITHUB_ENV"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          printf '{"run_id":"%s","commit_sha":"%s","branch":"%s","database_writes":false,"storage_writes":false}\n' \
            "$GITHUB_RUN_ID" "$CHECKED_OUT_SHA" "$CHECKED_OUT_BRANCH" > "$REPORT_DIR/run_metadata.json"

      - name: Rebuild English Master Index from source evidence
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/audits/verified_master_set_index_v1_build_english_master_index.mjs \
              --output-dir "$CANDIDATE_DIR" \
              --concurrency 8 \
              --skip-db-audit 2>&1 | tee "$REPORT_DIR/master_index_build.log"; then
            printf '{"status":"healthy","preserved_prior_english_master_index":false}\n' \
              > "$REPORT_DIR/source_health.json"
          elif grep -q 'Error: \[SOURCE_UNAVAILABLE\]' "$REPORT_DIR/master_index_build.log"; then
            test -d "$BASELINE_DIR"
            cp -a "$BASELINE_DIR/." "$CANDIDATE_DIR/"
            printf '{"status":"source_inventory_unavailable","preserved_prior_english_master_index":true,"canonical_writes":false,"database_writes":false,"storage_writes":false}\n' \
              > "$REPORT_DIR/source_health.json"
          else
            printf 'English Master Index rebuild failed an integrity gate; publication is blocked.\n' >&2
            exit 1
          fi
          node scripts/workers/english_pokemon_master_index_refresh_v1.mjs \
            --mode=plan \
            --baseline-dir="$BASELINE_DIR" \
            --candidate-dir="$CANDIDATE_DIR" \
            --out-dir="$REPORT_DIR" 2>&1 | tee "$REPORT_DIR/refresh_plan.log"
          node scripts/workers/pokemon_language_master_index_refresh_v1.mjs \
            --mode=plan \
            --out-dir="$LANGUAGE_REPORT_DIR" \
            --concurrency=4 2>&1 | tee "$LANGUAGE_REPORT_DIR/refresh_plan.log"
          if node scripts/workers/universal_catalog_discovery_v1.mjs \
              --as-of="$(date -u +%F)" \
              --source-only \
              --pokemon-language-candidate-dir="$LANGUAGE_REPORT_DIR/candidate_index" \
              --out-dir="$DISCOVERY_DIR" 2>&1 | tee "$DISCOVERY_DIR/discovery.log"; then
            node scripts/workers/japanese_pokemon_master_index_incremental_refresh_v1.mjs \
              --mode=plan \
              --as-of="$(date -u +%F)" \
              --discovery-dir="$DISCOVERY_DIR" \
              --out-dir="$JAPANESE_REPORT_DIR" 2>&1 | tee "$JAPANESE_REPORT_DIR/refresh_plan.log"
          else
            if grep -q 'Error: \[SOURCE_UNAVAILABLE\]' "$DISCOVERY_DIR/discovery.log"; then
              printf '{"changed":false,"status":"source_discovery_unavailable","canonical_writes":false,"database_writes":false,"storage_writes":false}\n' \
                > "$JAPANESE_REPORT_DIR/plan.json"
              printf '{"status":"source_discovery_unavailable","preserved_prior_master_index":true}\n' \
                > "$JAPANESE_REPORT_DIR/source_health.json"
            else
              printf 'Japanese discovery failed an integrity gate; publication is blocked.\n' >&2
              exit 1
            fi
          fi

      - name: Apply changed facts to a data-only branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          ENGLISH_CHANGED="$(node -e "const p=require(process.argv[1]); process.stdout.write(String(p.changed))" "$REPORT_DIR/refresh_plan.json")"
          LANGUAGE_CHANGED="$(node -e "const p=require(process.argv[1]); process.stdout.write(String(p.changed))" "$LANGUAGE_REPORT_DIR/plan.json")"
          JAPANESE_CHANGED="$(node -e "const p=require(process.argv[1]); process.stdout.write(String(p.changed))" "$JAPANESE_REPORT_DIR/plan.json")"
          if [[ "$ENGLISH_CHANGED" == "true" || "$LANGUAGE_CHANGED" == "true" || "$JAPANESE_CHANGED" == "true" ]]; then
            CHANGED=true
          else
            CHANGED=false
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" != "true" ]; then exit 0; fi
          BRANCH="automation/pokemon-master-index-refresh-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          if [ "$ENGLISH_CHANGED" = "true" ]; then
            node scripts/workers/english_pokemon_master_index_refresh_v1.mjs \
              --mode=apply-to-worktree \
              --baseline-dir="$BASELINE_DIR" \
              --candidate-dir="$CANDIDATE_DIR" \
              --out-dir="$REPORT_DIR"
          fi
          if [ "$LANGUAGE_CHANGED" = "true" ]; then
            node scripts/workers/pokemon_language_master_index_refresh_v1.mjs \
              --mode=apply-to-worktree \
              --plan-dir="$LANGUAGE_REPORT_DIR"
          fi
          if [ "$JAPANESE_CHANGED" = "true" ]; then
            node scripts/workers/japanese_pokemon_master_index_incremental_refresh_v1.mjs \
              --mode=apply-to-worktree \
              --plan-dir="$JAPANESE_REPORT_DIR"
          fi
          node scripts/audits/english_master_index_cardtrader_normal_containment_v1.mjs
          node --test \
            tests/contracts/english_master_index_cardtrader_normal_containment_v1.test.mjs \
            tests/contracts/me04_finish_truth_v1.test.mjs \
            tests/contracts/english_pokemon_master_index_refresh_v1.test.mjs \
            tests/contracts/pokemon_language_master_index_v1.test.mjs \
            tests/contracts/japanese_pokemon_master_index_incremental_v1.test.mjs \
            tests/contracts/english_pokemon_incremental_promotion_v1.test.mjs \
            tests/contracts/universal_catalog_discovery_v1.test.mjs
          git diff --check
          UNEXPECTED_PATHS="$(git diff --name-only | grep -Ev \
            '^(docs/audits/verified_master_set_index_v1/english_master_index_v1/|docs/audits/verified_master_set_index_v1/cardtrader_normal_containment_v1/|docs/audits/pokemon_language_master_index_v1/)' || true)"
          if [ -n "$UNEXPECTED_PATHS" ]; then
            printf 'Unexpected Master Index refresh paths:\n%s\n' "$UNEXPECTED_PATHS" >&2
            exit 1
          fi
          git config user.name "grookai-catalog-automation"
          git config user.email "catalog-automation@grookai.com"
          git add \
            "$BASELINE_DIR" \
            "docs/audits/verified_master_set_index_v1/cardtrader_normal_containment_v1"
          if [ -e "docs/audits/pokemon_language_master_index_v1" ]; then
            git add "docs/audits/pokemon_language_master_index_v1"
          fi
          git commit -m "data(pokemon): refresh language Master Indexes"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git rebase "origin/${{ github.event.repository.default_branch }}"
          git diff "origin/${{ github.event.repository.default_branch }}" --check
          UNEXPECTED_PATHS="$(git diff --name-only "origin/${{ github.event.repository.default_branch }}"...HEAD | grep -Ev \
            '^(docs/audits/verified_master_set_index_v1/english_master_index_v1/|docs/audits/verified_master_set_index_v1/cardtrader_normal_containment_v1/|docs/audits/pokemon_language_master_index_v1/)' || true)"
          if [ -n "$UNEXPECTED_PATHS" ]; then
            printf 'Unexpected rebased Master Index paths:\n%s\n' "$UNEXPECTED_PATHS" >&2
            exit 1
          fi
          node --test \
            tests/contracts/english_pokemon_master_index_refresh_v1.test.mjs \
            tests/contracts/pokemon_language_master_index_v1.test.mjs \
            tests/contracts/japanese_pokemon_master_index_incremental_v1.test.mjs \
            tests/contracts/universal_catalog_discovery_v1.test.mjs
          git push origin "HEAD:$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Reconcile language source adapter health issue
        if: always()
        uses: actions/github-script@v7
        env:
          LANGUAGE_REPORT_DIR: ${{ env.LANGUAGE_REPORT_DIR }}
        with:
          script: |
            const fs = require('fs');
            const summaryPath = `${process.env.LANGUAGE_REPORT_DIR}/summary.json`;
            if (!fs.existsSync(summaryPath)) return;
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const failures = summary.required_live_language_failures || [];
            const errors = summary.source_error_languages || [];
            const anomalies = summary.source_anomaly_languages || [];
            const englishHealthPath = `${process.env.REPORT_DIR}/source_health.json`;
            const englishHealth = fs.existsSync(englishHealthPath)
              ? JSON.parse(fs.readFileSync(englishHealthPath, 'utf8'))
              : null;
            const japaneseHealthPath = `${process.env.JAPANESE_REPORT_DIR}/source_health.json`;
            const japaneseHealth = fs.existsSync(japaneseHealthPath)
              ? JSON.parse(fs.readFileSync(japaneseHealthPath, 'utf8'))
              : null;
            const title = '[Pokemon Master Index] Language source adapter debt';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (failures.length === 0 && errors.length === 0 &&
                anomalies.length === 0 && englishHealth?.status === 'healthy' &&
                !japaneseHealth) {
              if (existing) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              return;
            }
            const body = [
              'The daily language candidate index preserved all prior authority and detected source adapter debt.',
              '',
              `Required live scopes without a usable baseline: ${JSON.stringify(failures)}`,
              `Source errors with preserved baselines: ${JSON.stringify(errors)}`,
              `Scopes with quarantined source anomalies: ${JSON.stringify(anomalies)}`,
              `English source inventory: ${JSON.stringify(englishHealth)}`,
              `Japanese source discovery: ${JSON.stringify(japaneseHealth)}`,
              '',
              'No candidate-only row received canonical authority.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Open governed Master Index update pull request
        id: pr
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "data(pokemon): refresh language Master Indexes" \
            --body "Automated source-evidence refresh. This PR changes allowlisted Master Index artifacts only. It performs no database, Storage, pricing, publication, or Vault writes. The workflow already passed deterministic source, continuity, diff, and focused contract gates."
          PR_NUMBER="$(gh pr view "$BRANCH" --json number --jq .number)"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Approve and verify generated pull request checks
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          EXPECTED_PATH='.github/workflows/ci-guard-keys.yml'
          RUN_ID=''
          for ATTEMPT in $(seq 1 30); do
            RUN_ID="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$HEAD_SHA" -f event=pull_request -f per_page=100 \
              --jq ".workflow_runs[] | select(.path == \"$EXPECTED_PATH\") | .id" \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            printf 'Expected generated-PR guard run was not created for %s.\n' "$HEAD_SHA" >&2
            exit 1
          fi
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
          if [ "$CONCLUSION" = "action_required" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/approve"
          fi
          gh run watch "$RUN_ID" --exit-status
          FINAL_CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
          test "$FINAL_CONCLUSION" = "success"
          printf '{"pull_request":%s,"head_sha":"%s","guard_run_id":%s,"guard_conclusion":"%s"}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$RUN_ID" "$FINAL_CONCLUSION" \
            > "$REPORT_DIR/generated_pr_guard_readback.json"

      - name: Merge governed data-only update automatically
        id: merge
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=''
          for ATTEMPT in 1 2 3 4 5; do
            if RESPONSE="$(gh api \
                --method PUT \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
                -f merge_method=squash 2>&1)"; then
              if echo "$RESPONSE" | jq -e '.merged == true' >/dev/null; then break; fi
            fi
            if [ "$ATTEMPT" = "5" ]; then
              printf '%s\n' "$RESPONSE" >&2
              exit 1
            fi
            sleep $((ATTEMPT * 3))
          done
          MERGED_SHA="$(echo "$RESPONSE" | jq -r .sha)"
          test -n "$MERGED_SHA"
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
          printf '{"pull_request":%s,"merged_sha":"%s","producer_run_id":"%s"}\n' \
            "$PR_NUMBER" "$MERGED_SHA" "$GITHUB_RUN_ID" > "$REPORT_DIR/automatic_merge_readback.json"

      - name: Dispatch fresh read-only discovery and shadow reconciliation
        if: steps.merge.outputs.merged_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run universal-catalog-discovery.yml --ref "${{ github.event.repository.default_branch }}"
          gh workflow run catalog-incremental-promotion.yml --ref "${{ github.event.repository.default_branch }}"
          printf '{"merged_sha":"%s","discovery_dispatched":true,"shadow_reconciliation_dispatched":true}\n' \
            "${{ steps.merge.outputs.merged_sha }}" > "$REPORT_DIR/downstream_dispatch.json"

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-master-index-refresh-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}
            ${{ env.CANDIDATE_DIR }}
            ${{ env.LANGUAGE_REPORT_DIR }}
            ${{ env.DISCOVERY_DIR }}
            ${{ env.JAPANESE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Open or update Master Index refresh failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Pokemon Master Index] Language refresh failure';
            const body = `The governed Pokemon language Master Index refresh failed closed. ` +
              `No canonical, database, Storage, pricing, publication, or Vault writes were authorized.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Close resolved Master Index refresh failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Pokemon Master Index] Language refresh failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, state: 'closed',
            });
