name: Collectible Wave 1 Set Apply Proposal

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: collectible-wave1-set-apply-proposal-v1
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NODE_OPTIONS: --use-system-ca
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify apply-proposal contracts
        run: |
          node --check backend/catalog/collectible_wave1_set_apply_proposal_v1.mjs
          node --check scripts/workers/collectible_wave1_set_apply_proposal_v1.mjs
          node --test tests/contracts/collectible_wave1_set_apply_proposal_v1.test.mjs
          git diff --check

      - name: Download exact reviewed set-foundation artifact
        uses: actions/download-artifact@v5
        with:
          name: collectible-wave1-set-foundation-proposal-33142767700
          path: ${{ runner.temp }}/wave1-set-foundation-proposal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "33142767700"

      - name: Build production read-only apply proposal
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          OUT_DIR="$RUNNER_TEMP/collectible-wave1-set-apply-proposal-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          node scripts/workers/collectible_wave1_set_apply_proposal_v1.mjs \
            --foundation-artifact-dir="$RUNNER_TEMP/wave1-set-foundation-proposal" \
            --out-dir="$OUT_DIR" \
            --expected-head-sha="$GITHUB_SHA"

      - name: Upload proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectible-wave1-set-apply-proposal-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
