name: Special Variant Printing Rollback Proof Temporary Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-variant-printing-rollback-proof
  cancel-in-progress: false

jobs:
  rollback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EVIDENCE_SOURCE_SHA: 26e11d580767eb0f52ee2319039235c5641e12a7

    steps:
      - name: Check out frozen proof ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_SOURCE_SHA" HEAD
          test -n "$SUPABASE_DB_URL"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run rollback-proof contracts
        run: |
          node --test \
            tests/contracts/special_variant_printing_authority_v1.test.mjs \
            tests/contracts/special_variant_printing_guarded_manifest_v1.test.mjs \
            tests/contracts/special_variant_printing_transactional_rollback_v1.test.mjs

      - name: Execute transactionally rolled-back proof
        id: proof
        run: node scripts/audits/special_variant_printing_transactional_rollback_v1.mjs

      - name: Record runner provenance
        if: ${{ always() }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          const output = {
            version: 'SPECIAL_VARIANT_PRINTING_GITHUB_RUNNER_METADATA_V1',
            generated_at: new Date().toISOString(),
            github_sha: process.env.GITHUB_SHA,
            github_ref: process.env.GITHUB_REF,
            github_run_id: process.env.GITHUB_RUN_ID,
            github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            evidence_source_sha: process.env.EVIDENCE_SOURCE_SHA,
            proof_step_outcome: '${{ steps.proof.outcome }}',
            workflow: process.env.GITHUB_WORKFLOW,
            durable_db_writes_authorized: false,
            apply_mode_available: false
          };
          await fs.writeFile(
            'docs/audits/special_variant_printing_authority_v1/github_runner_metadata_v1.json',
            `${JSON.stringify(output, null, 2)}\n`
          );
          NODE

      - name: Upload rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: special-variant-printing-rollback-proof-${{ github.run_id }}
          path: docs/audits/special_variant_printing_authority_v1
          if-no-files-found: error
          retention-days: 30
