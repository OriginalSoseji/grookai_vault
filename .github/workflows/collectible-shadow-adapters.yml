name: Collectible Shadow Adapter Probes

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: collectible-shadow-adapters-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_AUTOMATION_MODE: shadow-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify shadow adapter contracts
        run: |
          node --check backend/catalog/collectible_shadow_adapter_registry_v1.mjs
          node --check scripts/workers/collectible_shadow_adapter_probe_v1.mjs
          node --test tests/contracts/collectible_shadow_adapters_v1.test.mjs
          git diff --check

      - name: Probe official collectible catalogs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          OUT_DIR="$RUNNER_TEMP/collectible-shadow-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          node scripts/workers/collectible_shadow_adapter_probe_v1.mjs \
            --out-dir="$OUT_DIR" \
            --expected-head-sha="$GITHUB_SHA" \
            --max-concurrency=4 \
            --request-timeout-ms=30000

      - name: Report source failures
        if: always() && env.OUT_DIR != ''
        uses: actions/github-script@v7
        env:
          OUT_DIR: ${{ env.OUT_DIR }}
        with:
          script: |
            const fs = require('fs');
            const summaryPath = `${process.env.OUT_DIR}/summary.json`;
            if (!fs.existsSync(summaryPath)) return;
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const title = '[Collectible Shadow] Adapter source failures';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (summary.failed_adapter_count === 0) {
              if (existing) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              return;
            }
            const body = `${summary.failed_adapter_count} official catalog probes failed. ` +
              `No candidates were invented and no production writer ran.\n\n` +
              `Adapters: ${summary.failed_adapter_ids.join(', ')}\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectible-shadow-adapters-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
