name: Pokemon Sealed Health and Discovery
on:
  schedule:
    - cron: '35 11 * * *'
  workflow_dispatch:
    inputs:
      audit_only:
        description: 'Skip price publication; run read-only discovery and health only'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: pokemon-sealed-health-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MOBILE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      POKEMON_SEALED_REFRESH_ACTIVE: ${{ vars.POKEMON_SEALED_REFRESH_ACTIVE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/contracts/pokemon_sealed_refresh_v1.test.mjs tests/contracts/pokemon_sealed_health_v1.test.mjs tests/contracts/pokemon_sealed_live_probe_v1.test.mjs tests/contracts/pokemon_sealed_world_v1.test.mjs tests/contracts/pokemon_sealed_maintenance_v1.test.mjs
      - name: Refresh already-verified price and image releases atomically
        id: refresh
        if: env.POKEMON_SEALED_REFRESH_ACTIVE == 'true' && inputs.audit_only != true
        run: node scripts/audits/pokemon_sealed_refresh_v1.mjs --mode=run --out="$RUNNER_TEMP/pokemon-sealed/refresh"
      - name: Inventory, refresh proposal and health readback (zero DB writes)
        if: always()
        run: |
          node scripts/audits/pokemon_sealed_inventory_v1.mjs --out="$RUNNER_TEMP/pokemon-sealed/inventory"
          node scripts/audits/pokemon_sealed_plan_v1.mjs --inventory="$RUNNER_TEMP/pokemon-sealed/inventory" --out="$RUNNER_TEMP/pokemon-sealed/proposal"
          node scripts/audits/pokemon_sealed_health_v1.mjs --inventory="$RUNNER_TEMP/pokemon-sealed/inventory" --out="$RUNNER_TEMP/pokemon-sealed/health"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-sealed-health-${{ github.run_id }}
          path: ${{ runner.temp }}/pokemon-sealed
          retention-days: 90
          if-no-files-found: error
      - name: Reconcile operator alert
        if: always()
        uses: actions/github-script@v7
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Pokemon Sealed] Catalog or price maintenance required';
            let summary;
            try { summary = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pokemon-sealed/health/summary.json`)); }
            catch { summary = {status:'attention_required',findings:['health_workflow_failed_before_readback']}; }
            if(process.env.REFRESH_OUTCOME==='failure') {
              summary.status='attention_required';
              summary.findings=[...new Set([...summary.findings,'refresh_execution_failed'])];
            }
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',creator:'github-actions[bot]',per_page:100});
            const existing = issues.find(i=>!i.pull_request&&i.title===title);
            if(summary.status==='healthy') {
              if(existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed'});
            } else {
              let aging=[];
              try { aging=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pokemon-sealed/health/aging_prices.json`)); } catch {}
              const productLines=aging.slice(0,20).map(r=>`- ${String(r.canonical_name).replace(/[\r\n`]/g,' ')} (TCGPlayer ${r.source_product_id}): ${r.age_days} days old; withheld from ${r.withheld_from}.`).join('\n');
              const body = `Daily Pokemon sealed audit needs attention. Inspect the separate refresh artifact for transaction outcome; the health audit itself is read-only apart from its bounded authentication probe.\n\n${summary.findings.map(f=>`- ${f}`).join('\n')}\n\n${aging.length} aging products; ${summary.prices_expiring_next_day??0} reach the expiry boundary next day.\n${productLines}\n\nFull product list: aging_prices.json in the run artifact. Never substitute prices or re-date source observations.\n\nEvidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if(existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,body});
              else await github.rest.issues.create({...context.repo,title,body});
              const maintenanceOnly=summary.findings.every(f=>['price_refresh_due_before_seven_day_expiry','new_sealed_candidates_require_identity_review'].includes(f));
              if(maintenanceOnly) core.warning('Source coverage maintenance is due; see the operator issue.');
              else core.setFailed('Pokemon sealed health requires attention; see preserved artifacts.');
            }
