name: Pokemon Sealed Health and Discovery
on:
  schedule:
    - cron: '35 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: pokemon-sealed-health-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/contracts/pokemon_sealed_health_v1.test.mjs tests/contracts/pokemon_sealed_world_v1.test.mjs
      - name: Inventory, refresh proposal and health readback (zero DB writes)
        run: |
          node scripts/audits/pokemon_sealed_inventory_v1.mjs --out="$RUNNER_TEMP/pokemon-sealed/inventory"
          node scripts/audits/pokemon_sealed_plan_v1.mjs --inventory="$RUNNER_TEMP/pokemon-sealed/inventory" --out="$RUNNER_TEMP/pokemon-sealed/proposal"
          node scripts/audits/pokemon_sealed_health_v1.mjs --inventory="$RUNNER_TEMP/pokemon-sealed/inventory" --out="$RUNNER_TEMP/pokemon-sealed/health"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokemon-sealed-health-${{ github.run_id }}
          path: ${{ runner.temp }}/pokemon-sealed
          retention-days: 90
          if-no-files-found: error
      - name: Reconcile operator alert
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Pokemon Sealed] Catalog or price maintenance required';
            let summary;
            try { summary = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pokemon-sealed/health/summary.json`)); }
            catch { summary = {status:'attention_required',findings:['health_workflow_failed_before_readback']}; }
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',creator:'github-actions[bot]',per_page:100});
            const existing = issues.find(i=>!i.pull_request&&i.title===title);
            if(summary.status==='healthy') {
              if(existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed'});
            } else {
              const body = `Daily read-only audit needs attention. No catalog, price, Storage or pointer writes were made.\n\n${summary.findings.map(f=>`- ${f}`).join('\n')}\n\nEvidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if(existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,body});
              else await github.rest.issues.create({...context.repo,title,body});
              core.setFailed('Pokemon sealed health requires attention; see preserved artifacts.');
            }
