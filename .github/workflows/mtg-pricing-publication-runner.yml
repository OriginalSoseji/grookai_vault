name: MTG Pricing Publication Runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Governed MTG pricing operation
        required: true
        type: choice
        options:
          - migration_dry_run
          - migration_apply
          - parent_map_plan
          - parent_map_dry_run
          - parent_map_apply
          - finish_map_plan
          - finish_map_dry_run
          - finish_map_apply
          - publication_dry_run
          - publication_shadow
          - publication_production
          - correction_plan
          - correction_dry_run
          - correction_apply
      expected_sha:
        description: Exact merged commit SHA that must produce the evidence
        required: true
        type: string
      expected_shadow_run_key:
        description: Reconciled shadow run required before production activation
        required: false
        type: string
      expected_correction_dry_run_id:
        description: Successful correction dry-run workflow run required before apply
        required: false
        type: string
      expected_finish_plan_id:
        description: Successful finish-map plan workflow run required before dry-run
        required: false
        type: string
      expected_finish_dry_run_id:
        description: Successful finish-map dry-run workflow run required before apply
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mtg-pricing-publication-v1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SUPABASE_URL: https://ycdxbpibncqcchqiihfz.supabase.co
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TARGET_MIGRATION: 20261020220000_mtg_reviewed_printing_correction_bridge_v1.sql
      EXPECTED_SHADOW_RUN_KEY: ${{ inputs.expected_shadow_run_key }}
      EXPECTED_CORRECTION_DRY_RUN_ID: ${{ inputs.expected_correction_dry_run_id }}
      EXPECTED_FINISH_PLAN_ID: ${{ inputs.expected_finish_plan_id }}
      EXPECTED_FINISH_DRY_RUN_ID: ${{ inputs.expected_finish_dry_run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize production guard evidence
        if: ${{ inputs.operation == 'publication_production' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mtg-pricing-production-guard.json" <<'JSON'
          {
            "policy_version": "MTG_PRICING_PRODUCTION_GUARD_V1",
            "status": "preflight_started",
            "ready_for_production": false,
            "findings": []
          }
          JSON

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install operator dependencies
        run: npm ci --ignore-scripts

      - name: Verify frozen repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f "supabase/migrations/$TARGET_MIGRATION"
          node --check backend/pricing/mtg_pricing_production_guard_v1.mjs
          node --check backend/pricing/mtg_tcgplayer_parent_mapping_policy_v1.mjs
          node --check scripts/audits/mtg_tcgplayer_parent_mapping_backfill_v1.mjs
          node --check scripts/audits/mtg_tcgplayer_reviewed_printing_correction_v1.mjs
          node --check scripts/workers/tcgplayer_market_publication_worker_v1.mjs
          node --check backend/pricing/market_activation_coverage_v1.mjs
          node --test \
            tests/contracts/market_activation_coverage_v1.test.mjs \
            tests/contracts/mtg_tcgplayer_market_publication_v1.test.mjs \
            tests/contracts/mtg_tcgplayer_reviewed_printing_correction_v1.test.mjs \
            tests/contracts/tcgplayer_market_publication_v1.test.mjs \
            tests/contracts/tcgplayer_market_full_rollout_guard_v1.test.mjs
          git diff --check

      - name: Inspect the exact pending migration
        if: ${{ startsWith(inputs.operation, 'migration_') }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.54.11 db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all \
            --dry-run 2>&1 | tee migration_dry_run.txt
          grep -q "$TARGET_MIGRATION" migration_dry_run.txt
          mapfile -t pending < <(
            grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' migration_dry_run.txt |
              sort -u
          )
          test "${#pending[@]}" -eq 1
          test "${pending[0]}" = "$TARGET_MIGRATION"

      - name: Apply the exact migration
        if: ${{ inputs.operation == 'migration_apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.54.11 db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all \
            --yes

      - name: Execute parent-map operation
        if: ${{ startsWith(inputs.operation, 'parent_map_') }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${OPERATION#parent_map_}"
          out="$RUNNER_TEMP/mtg-parent-map-$mode"
          case "$mode" in
            plan)
              node scripts/audits/mtg_tcgplayer_parent_mapping_backfill_v1.mjs \
                --plan --expected-head-sha="$EXPECTED_SHA" --out-dir="$out"
              ;;
            dry_run)
              node scripts/audits/mtg_tcgplayer_parent_mapping_backfill_v1.mjs \
                --dry-run --expected-head-sha="$EXPECTED_SHA" --out-dir="$out"
              ;;
            apply)
              plan="$RUNNER_TEMP/mtg-parent-map-frozen-plan"
              node scripts/audits/mtg_tcgplayer_parent_mapping_backfill_v1.mjs \
                --plan --expected-head-sha="$EXPECTED_SHA" --out-dir="$plan"
              approval="$(node -e "const s=require(process.argv[1]);process.stdout.write(s.plan.required_approval)" "$plan/summary.json")"
              export MTG_TCGPLAYER_PARENT_MAPPING_APPROVAL="$approval"
              node scripts/audits/mtg_tcgplayer_parent_mapping_backfill_v1.mjs \
                --apply --expected-head-sha="$EXPECTED_SHA" --out-dir="$out"
              ;;
            *) exit 2 ;;
          esac

      - name: Execute exact Scryfall finish-map operation
        if: ${{ startsWith(inputs.operation, 'finish_map_') }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${OPERATION#finish_map_}"
          root="$RUNNER_TEMP/mtg-finish-map-$mode"
          source_dir="$root/source"
          out="$root/output"
          proof="$root/proof"
          mkdir -p "$source_dir" "$out" "$proof"

          download_fresh_source() {
            curl --fail --location --retry 3 \
              --header 'Accept: application/json' \
              --header 'User-Agent: grookai-vault-pricing-operator/1.0' \
              'https://api.scryfall.com/bulk-data/default-cards' \
              --output "$source_dir/metadata.json"
            download_uri="$(jq -er '.download_uri' "$source_dir/metadata.json")"
            source_updated_at="$(jq -er '.updated_at' "$source_dir/metadata.json")"
            curl --fail --location --retry 3 \
              --header 'Accept: application/json' \
              --header 'User-Agent: grookai-vault-pricing-operator/1.0' \
              "$download_uri" --output "$source_dir/default-cards.json"
            jq -c '.[]' "$source_dir/default-cards.json" | gzip -n -9 \
              > "$source_dir/default-cards.jsonl.gz"
            rm "$source_dir/default-cards.json"
            source_sha256="$(sha256sum "$source_dir/default-cards.jsonl.gz" | cut -d' ' -f1)"
          }

          download_proof() {
            local proof_id="$1"
            local expected_operation="$2"
            [[ "$proof_id" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$proof_id" \
              > "$proof/run.json"
            gh run download "$proof_id" --repo "$GITHUB_REPOSITORY" \
              --name "mtg-pricing-$expected_operation-$proof_id" \
              --dir "$proof/artifact"
            mapfile -t proof_summaries < <(find "$proof/artifact" -type f -path '*/output/summary.json')
            mapfile -t proof_sources < <(find "$proof/artifact" -type f -name 'default-cards.jsonl.gz')
            test "${#proof_summaries[@]}" -eq 1
            test "${#proof_sources[@]}" -eq 1
            cp "${proof_sources[0]}" "$source_dir/default-cards.jsonl.gz"
            cp "${proof_summaries[0]}" "$proof/summary.json"
            node --input-type=module - "$proof/run.json" "$proof/summary.json" \
              "$expected_operation" <<'NODE'
          import fs from 'node:fs';
          const [runPath, summaryPath, expectedOperation] = process.argv.slice(2);
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const expectedMode = expectedOperation.endsWith('plan') ? 'plan' : 'dry-run';
          const expectedStatus = expectedMode === 'plan' ? 'planned' : 'rollback_verified';
          if (run.status !== 'completed' || run.conclusion !== 'success' ||
              run.event !== 'workflow_dispatch' || run.head_sha !== process.env.EXPECTED_SHA ||
              run.path !== '.github/workflows/mtg-pricing-publication-runner.yml') {
            throw new Error('Finish-map proof workflow identity mismatch');
          }
          if (summary.status !== expectedStatus || summary.mode !== expectedMode ||
              summary.plan?.repository?.commit_sha !== process.env.EXPECTED_SHA ||
              summary.plan?.blocking_unsafe_count !== 0) {
            throw new Error('Finish-map proof summary mismatch');
          }
          NODE
            source_sha256="$(node -e \
              "const s=require(process.argv[1]);process.stdout.write(s.plan.authority.source_sha256)" \
              "$proof/summary.json")"
            source_updated_at="$(node -e \
              "const s=require(process.argv[1]);process.stdout.write(s.plan.authority.source_updated_at)" \
              "$proof/summary.json")"
          }

          current_pricing_run_id="$(node --input-type=module - <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({
            connectionString: process.env.SUPABASE_DB_URL,
            ssl: { rejectUnauthorized: false },
            connectionTimeoutMillis: 15_000,
            statement_timeout: 120_000,
            query_timeout: 125_000,
          });
          await client.connect();
          try {
            const result = await client.query(
              'select run_id from public.market_price_current_publication where singleton = true',
            );
            if (result.rows.length !== 1) throw new Error('Current pricing publication run is unavailable');
            process.stdout.write(String(result.rows[0].run_id));
          } finally { await client.end(); }
          NODE
          )"

          case "$mode" in
            plan)
              download_fresh_source
              pricing_run_id="$current_pricing_run_id"
              ;;
            dry_run)
              download_proof "$EXPECTED_FINISH_PLAN_ID" 'finish_map_plan'
              pricing_run_id="$(node -e \
                "const s=require(process.argv[1]);process.stdout.write(s.plan.authority.pricing_run_id)" \
                "$proof/summary.json")"
              ;;
            apply)
              download_proof "$EXPECTED_FINISH_DRY_RUN_ID" 'finish_map_dry_run'
              pricing_run_id="$(node -e \
                "const s=require(process.argv[1]);process.stdout.write(s.plan.authority.pricing_run_id)" \
                "$proof/summary.json")"
              ;;
            *) exit 2 ;;
          esac
          test "$pricing_run_id" = "$current_pricing_run_id"
          test "$(sha256sum "$source_dir/default-cards.jsonl.gz" | cut -d' ' -f1)" = "$source_sha256"

          common=(
            "--scryfall-jsonl-gz=$source_dir/default-cards.jsonl.gz"
            "--expected-source-sha256=$source_sha256"
            "--source-updated-at=$source_updated_at"
            "--pricing-run-id=$pricing_run_id"
            "--expected-head-sha=$EXPECTED_SHA"
          )
          if [[ "$mode" = 'plan' ]]; then
            node scripts/audits/mtg_fresh_scryfall_finish_backfill_v1.mjs \
              --plan "${common[@]}" "--out-dir=$out"
            exit 0
          fi

          current_plan="$root/current-plan"
          node scripts/audits/mtg_fresh_scryfall_finish_backfill_v1.mjs \
            --plan "${common[@]}" "--out-dir=$current_plan"
          node --input-type=module - "$proof/summary.json" "$current_plan/summary.json" <<'NODE'
          import fs from 'node:fs';
          const [proofPath, currentPath] = process.argv.slice(2);
          const proof = JSON.parse(fs.readFileSync(proofPath, 'utf8'));
          const current = JSON.parse(fs.readFileSync(currentPath, 'utf8'));
          if (proof.plan?.plan_fingerprint !== current.plan?.plan_fingerprint ||
              proof.plan?.selected_insert_count !== current.plan?.selected_insert_count ||
              proof.plan?.authority?.source_sha256 !== current.plan?.authority?.source_sha256 ||
              proof.plan?.authority?.pricing_run_id !== current.plan?.authority?.pricing_run_id) {
            throw new Error('Finish-map plan drifted from required proof');
          }
          NODE

          if [[ "$mode" = 'dry_run' ]]; then
            node scripts/audits/mtg_fresh_scryfall_finish_backfill_v1.mjs \
              --dry-run "${common[@]}" "--out-dir=$out"
          else
            export MTG_FRESH_SCRYFALL_FINISH_MAPPING_APPROVAL="$(node -e \
              "const s=require(process.argv[1]);process.stdout.write(s.plan.required_approval)" \
              "$current_plan/summary.json")"
            node scripts/audits/mtg_fresh_scryfall_finish_backfill_v1.mjs \
              --apply "${common[@]}" "--out-dir=$out"
          fi

      - name: Execute pricing publication operation
        if: ${{ startsWith(inputs.operation, 'publication_') }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${OPERATION#publication_}"
          shadow_source_sync_run_id=""
          if [[ "$mode" = "production" ]]; then
            export MTG_PRICING_PRODUCTION_GUARD_OUT="$RUNNER_TEMP/mtg-pricing-production-guard.json"
            node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import { buildMtgPricingProductionGuardStartedArtifactV1 } from './backend/pricing/mtg_pricing_production_guard_v1.mjs';
          const initialGuardArtifact = buildMtgPricingProductionGuardStartedArtifactV1();
          await fs.writeFile(
            process.env.MTG_PRICING_PRODUCTION_GUARD_OUT,
            `${JSON.stringify(initialGuardArtifact, null, 2)}\n`,
            'utf8',
          );
          NODE
            test -n "$EXPECTED_SHADOW_RUN_KEY"
            shadow_source_sync_run_id="$(node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import pg from 'pg';
          import {
            buildMtgPricingProductionGuardFailureArtifactV1,
            buildMtgPricingProductionGuardStartedArtifactV1,
            evaluateMtgPricingProductionGuardV1,
          } from './backend/pricing/mtg_pricing_production_guard_v1.mjs';
          const artifactPath = process.env.MTG_PRICING_PRODUCTION_GUARD_OUT;
          let guardArtifact = buildMtgPricingProductionGuardStartedArtifactV1();
          const persistGuardArtifact = async () => fs.writeFile(
            artifactPath,
            `${JSON.stringify(guardArtifact, null, 2)}\n`,
            'utf8',
          );
          await persistGuardArtifact();
          const client = new pg.Client({
            connectionString: process.env.SUPABASE_DB_URL,
            ssl: { rejectUnauthorized: false },
            connectionTimeoutMillis: 15_000,
            statement_timeout: 120_000,
            query_timeout: 125_000,
          });
          let connected = false;
          try {
            await client.connect();
            connected = true;
            const result = await client.query(
              `select count(*)::integer as count
                 from public.market_price_pipeline_runs
                where run_key = $1
                  and run_mode = 'shadow'
                  and state = 'shadow_verified'
                  and reconciliation_state = 'reconciled'
                  and policy_version = 'TCGPLAYER_MARKET_PUBLICATION_POLICY_V1_3'
                  and git_commit_sha = $2`,
              [process.env.EXPECTED_SHADOW_RUN_KEY, process.env.EXPECTED_SHA],
            );
            if (Number(result.rows[0].count) !== 1) {
              throw new Error('Exact reconciled shadow evidence was not found');
            }
            const categoryResult = await client.query(
              `with shadow_run as (
                 select id
                   from public.market_price_pipeline_runs
                  where run_key = $1
              ),
              shadow_counts as (
                 select
                   count(*) filter (
                     where decision.evidence ->> 'category_id' = '1'
                   )::integer as mtg_selected,
                   count(distinct decision.card_printing_id) filter (
                     where decision.evidence ->> 'category_id' = '1'
                       and decision.eligible = true
                       and decision.decision = 'publish'
                       and decision.publication_lane = 'current'
                       and not exists (
                         select 1
                         from public.card_printing_truth_reviews truth_review
                         where truth_review.card_printing_id = decision.card_printing_id
                           and truth_review.active = true
                           and truth_review.public_visibility in (
                             'hidden_pending_review',
                             'hidden_unsupported'
                           )
                       )
                   )::integer as mtg_eligible,
                   count(distinct decision.card_printing_id) filter (
                     where decision.evidence ->> 'category_id' = '3'
                       and decision.eligible = true
                       and decision.decision = 'publish'
                       and decision.publication_lane = 'current'
                       and not exists (
                         select 1
                         from public.card_printing_truth_reviews truth_review
                         where truth_review.card_printing_id = decision.card_printing_id
                           and truth_review.active = true
                           and truth_review.public_visibility in (
                             'hidden_pending_review',
                             'hidden_unsupported'
                           )
                       )
                   )::integer as pokemon_eligible
                 from public.market_price_qualification_decisions decision
                 join shadow_run on shadow_run.id = decision.run_id
              ),
              current_counts as (
                 select
                   count(distinct snapshot.card_printing_id) filter (
                     where decision.evidence ->> 'category_id' = '1'
                   )::integer as mtg_baseline_eligible,
                   count(distinct snapshot.card_printing_id) filter (
                     where decision.evidence ->> 'category_id' = '3'
                   )::integer as pokemon_baseline_eligible,
                   count(distinct snapshot.card_printing_id) filter (
                     where decision.evidence ->> 'category_id' = '3'
                       and snapshot.source_sync_finished_at >=
                       now() - interval '36 hours'
                   )::integer as fresh_pokemon_eligible
                 from public.market_price_current_publication current_state
                 join public.market_price_publication_sets publication_set
                   on publication_set.id = current_state.publication_set_id
                  and publication_set.run_id = current_state.run_id
                  and publication_set.publication_state = 'published'
                 join public.market_price_pipeline_runs pipeline_run
                   on pipeline_run.id = current_state.run_id
                  and pipeline_run.reconciliation_state = 'reconciled'
                  and pipeline_run.state in ('published', 'verified')
                 join public.market_price_publication_snapshots snapshot
                   on snapshot.publication_set_id = current_state.publication_set_id
                  and snapshot.run_id = current_state.run_id
                  and snapshot.publication_state = 'published'
                  and snapshot.freshness_state = 'fresh'
                 join public.market_price_qualification_decisions decision
                   on decision.id = snapshot.qualification_decision_id
                  and decision.run_id = snapshot.run_id
                  and decision.eligible = true
                  and decision.decision = 'publish'
                  and decision.publication_lane = 'current'
                where current_state.singleton
                  and not exists (
                    select 1
                    from public.card_printing_truth_reviews truth_review
                    where truth_review.card_printing_id = snapshot.card_printing_id
                      and truth_review.active = true
                      and truth_review.public_visibility in (
                        'hidden_pending_review',
                        'hidden_unsupported'
                      )
                  )
              )
              select
                shadow_counts.mtg_selected,
                shadow_counts.mtg_eligible,
                current_counts.mtg_baseline_eligible,
                shadow_counts.pokemon_eligible as shadow_pokemon_eligible,
                current_counts.pokemon_baseline_eligible,
                current_counts.fresh_pokemon_eligible
              from shadow_counts cross join current_counts`,
              [process.env.EXPECTED_SHADOW_RUN_KEY],
            );
            const counts = categoryResult.rows[0];
            guardArtifact = evaluateMtgPricingProductionGuardV1({
              mtgSelected: counts.mtg_selected,
              mtgEligible: counts.mtg_eligible,
              baselineMtgEligible: counts.mtg_baseline_eligible,
              shadowPokemonEligible: counts.shadow_pokemon_eligible,
              baselinePokemonEligible: counts.pokemon_baseline_eligible,
              freshCurrentPokemonEligible: counts.fresh_pokemon_eligible,
            });
            await persistGuardArtifact();
            if (!guardArtifact.ready_for_production) {
              throw new Error(
                `MTG pricing production guard blocked: ${JSON.stringify(guardArtifact.findings)}`,
              );
            }
            process.stdout.write(String((await client.query(
              `select source_sync_run_id
                 from public.market_price_pipeline_runs
                where run_key = $1`,
              [process.env.EXPECTED_SHADOW_RUN_KEY],
            )).rows[0].source_sync_run_id));
          } catch (error) {
            guardArtifact = buildMtgPricingProductionGuardFailureArtifactV1({
              priorArtifact: guardArtifact,
              error,
            });
            await persistGuardArtifact();
            throw error;
          } finally {
            if (connected) await client.end();
          }
          NODE
            )"
          fi
          out="$RUNNER_TEMP/mtg-pricing-$mode"
          run_key="mtg-global-market-$mode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          case "$mode" in
            dry_run) flag="--dry-run" ;;
            shadow) flag="--shadow" ;;
            production) flag="--production" ;;
            *) exit 2 ;;
          esac
          args=(
            "$flag"
            "--run-key=$run_key"
            "--out-root=$out"
            "--batch-size=1000"
            "--database-timeout-minutes=180"
          )
          if [[ "$mode" = "production" ]]; then
            test -n "$shadow_source_sync_run_id"
            args+=("--expected-source-sync-run-id=$shadow_source_sync_run_id")
          fi
          completed=false
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/mtg-pricing-$mode-attempt-$attempt.log"
            set +e
            node scripts/workers/tcgplayer_market_publication_worker_v1.mjs \
              "${args[@]}" 2>&1 | tee "$log"
            exit_code="${PIPESTATUS[0]}"
            set -e
            if [[ "$exit_code" -eq 0 ]]; then
              completed=true
              break
            fi
            retryable="$(node --input-type=module - "$log" <<'NODE'
          import fs from 'node:fs';
          import { classifyMarketPipelineFailureV1 } from './backend/pricing/tcgplayer_market_operations_policy_v1.mjs';
          const errorText = fs.readFileSync(process.argv[2], 'utf8');
          const classification = classifyMarketPipelineFailureV1({
            failedPhase: 'publication',
            errorText,
          });
          process.stdout.write(String(classification.retryable));
          NODE
            )"
            if [[ "$retryable" != "true" ]]; then
              exit "$exit_code"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit "$exit_code"
            fi
            sleep "$((attempt * 15))"
          done
          test "$completed" = true

      - name: Execute reviewed printing correction
        if: ${{ startsWith(inputs.operation, 'correction_') }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${OPERATION#correction_}"
          source_sync_run_id="$(node --input-type=module - <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({
            connectionString: process.env.SUPABASE_DB_URL,
            ssl: { rejectUnauthorized: false },
            connectionTimeoutMillis: 15_000,
            statement_timeout: 120_000,
            query_timeout: 125_000,
          });
          await client.connect();
          try {
            const result = await client.query(`select id from public.tcgcsv_source_sync_runs
              where sync_mode='current_full_sync' and status='completed' and failed_count=0
                and finished_at is not null
              order by finished_at desc,created_at desc,id desc limit 1`);
            if (result.rows.length !== 1) throw new Error('current source sync run unavailable');
            process.stdout.write(String(result.rows[0].id));
          } finally { await client.end(); }
          NODE
          )"
          out="$RUNNER_TEMP/mtg-reviewed-correction-$mode"
          common=(
            "--source-sync-run-id=$source_sync_run_id"
            "--expected-head-sha=$EXPECTED_SHA"
          )
          case "$mode" in
            plan)
              node scripts/audits/mtg_tcgplayer_reviewed_printing_correction_v1.mjs \
                --plan "${common[@]}" "--out-dir=$out"
              ;;
            dry_run)
              node scripts/audits/mtg_tcgplayer_reviewed_printing_correction_v1.mjs \
                --dry-run "${common[@]}" "--out-dir=$out"
              ;;
            apply)
              plan="$RUNNER_TEMP/mtg-reviewed-correction-frozen-plan"
              node scripts/audits/mtg_tcgplayer_reviewed_printing_correction_v1.mjs \
                --plan "${common[@]}" "--out-dir=$plan"
              [[ "$EXPECTED_CORRECTION_DRY_RUN_ID" =~ ^[0-9]+$ ]]
              proof="$RUNNER_TEMP/mtg-reviewed-correction-required-dry-run"
              mkdir -p "$proof"
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_CORRECTION_DRY_RUN_ID" \
                > "$proof/run.json"
              gh run download "$EXPECTED_CORRECTION_DRY_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "mtg-pricing-correction_dry_run-$EXPECTED_CORRECTION_DRY_RUN_ID" \
                --dir "$proof/artifact"
              mapfile -t proof_summaries < <(find "$proof/artifact" -type f -name summary.json)
              test "${#proof_summaries[@]}" -eq 1
              node --input-type=module - \
                "$proof/run.json" "${proof_summaries[0]}" "$plan/summary.json" <<'NODE'
              import fs from 'node:fs';
              const [runPath, proofPath, planPath] = process.argv.slice(2);
              const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
              const proof = JSON.parse(fs.readFileSync(proofPath, 'utf8'));
              const current = JSON.parse(fs.readFileSync(planPath, 'utf8'));
              const fail = (message) => { throw new Error(message); };
              if (run.status !== 'completed' || run.conclusion !== 'success' ||
                  run.event !== 'workflow_dispatch' || run.head_sha !== process.env.EXPECTED_SHA ||
                  run.path !== '.github/workflows/mtg-pricing-publication-runner.yml') {
                fail('Correction dry-run workflow identity mismatch');
              }
              if (proof.status !== 'rollback_verified' || proof.mode !== 'dry-run' ||
                  proof.plan?.repository?.commit_sha !== process.env.EXPECTED_SHA ||
                  proof.plan?.source_sync_run_id !== current.plan?.source_sync_run_id ||
                  proof.plan?.plan_fingerprint !== current.plan?.plan_fingerprint ||
                  proof.plan?.selected_update_count !== 2 ||
                  proof.updated?.parent_updated !== 1 || proof.updated?.printing_updated !== 1 ||
                  proof.view_before !== 'v_tcgplayer_market_qualification_candidates_v7') {
                fail('Correction dry-run rollback proof mismatch');
              }
          NODE
              export MTG_REVIEWED_PRINTING_CORRECTION_APPROVAL="$(node -e \
                "const s=require(process.argv[1]);process.stdout.write(s.plan.required_approval)" \
                "$plan/summary.json")"
              node scripts/audits/mtg_tcgplayer_reviewed_printing_correction_v1.mjs \
                --apply "${common[@]}" "--out-dir=$out"
              ;;
            *) exit 2 ;;
          esac

      - name: Upload immutable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mtg-pricing-${{ inputs.operation }}-${{ github.run_id }}
          path: |
            migration_dry_run.txt
            ${{ runner.temp }}/mtg-parent-map-*
            ${{ runner.temp }}/mtg-pricing-*
            ${{ runner.temp }}/mtg-finish-map-*
            ${{ runner.temp }}/mtg-reviewed-correction-*
          if-no-files-found: warn
          retention-days: 90
