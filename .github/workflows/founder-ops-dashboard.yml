name: Founder Ops Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  collect-founder-ops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect founder ops reports
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run founder:ops:collect

      - name: Collect production control-plane report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run production:ops:collect

      - name: Verify founder ops dashboard contract
        run: node --test tests/contracts/founder_ops_reports_v1.test.mjs

      - name: Publish founder ops summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Founder Operations Snapshot"
            echo
            echo "Generated from commit \`${GITHUB_SHA}\`."
            echo
            echo "Generated reports are attached to this workflow run; this monitor never commits to the repository or triggers a Vercel deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload founder ops evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-ops-${{ github.run_id }}
          path: |
            docs/audits/founder_ops_dashboard_v1
            docs/audits/production_backend_launch_v1
          if-no-files-found: warn
          retention-days: 30
