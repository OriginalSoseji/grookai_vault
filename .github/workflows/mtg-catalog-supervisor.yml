name: MTG Catalog Supervisor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - MTG Hidden Catalog Runner
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mtg-catalog-supervisor-v1
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on"
      CATALOG_AUTOMATION_MODE: shadow-only
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the default-branch supervisor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initialize supervisor evidence
        shell: bash
        run: |
          set -euo pipefail
          export SUPERVISOR_OUT_DIR="$RUNNER_TEMP/mtg-catalog-supervisor-$GITHUB_RUN_ID"
          echo "SUPERVISOR_OUT_DIR=$SUPERVISOR_OUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SUPERVISOR_OUT_DIR"
          printf '{"workflow_run_id":"%s","event":"%s","default_branch":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "${{ github.event.repository.default_branch }}" \
            > "$SUPERVISOR_OUT_DIR/invocation.json"

      - name: Install read-only supervisor dependencies
        run: npm ci --ignore-scripts

      - name: Verify supervisor syntax
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          node --check backend/pricing/mtg_catalog_supervisor_v1.mjs
          node --check scripts/audits/mtg_catalog_supervisor_v1.mjs

      - name: Reconcile the frozen catalog without dispatching a writer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audits/mtg_catalog_supervisor_v1.mjs \
            --shadow-only \
            --repository="$GITHUB_REPOSITORY" \
            --workflow-id=335602786 \
            --runner-ref=agent/mtg-pointer-release-v1 \
            --runner-commit=7e9f2bb92f56335a6a352f655e12000b344a63a4 \
            --as-of="$(date -u +%F)" \
            --max-sets=35 \
            --max-consecutive-failures=3 \
            --out-dir="$SUPERVISOR_OUT_DIR"

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-catalog-supervisor-${{ github.run_id }}
          path: ${{ runner.temp }}/mtg-catalog-supervisor-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
