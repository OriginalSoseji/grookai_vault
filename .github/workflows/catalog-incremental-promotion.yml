name: Catalog Incremental Promotion

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-incremental-promotion-v1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify promotion contracts
        run: |
          node --check scripts/workers/catalog_incremental_supervisor_v1.mjs
          node --check scripts/workers/catalog_incremental_promotion_v1.mjs
          node --check scripts/workers/one_piece_incremental_promotion_v1.mjs
          node --check scripts/workers/mtg_incremental_promotion_v1.mjs
          node --test \
            tests/contracts/catalog_incremental_supervisor_v1.test.mjs \
            tests/contracts/catalog_incremental_promotion_v1.test.mjs \
            tests/contracts/one_piece_incremental_promotion_v1.test.mjs \
            tests/contracts/mtg_incremental_promotion_v1.test.mjs
          git diff --check

      - name: Freeze current discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          DISCOVERY_DIR="$RUNNER_TEMP/catalog-discovery-$GITHUB_RUN_ID"
          PROMOTION_DIR="$RUNNER_TEMP/catalog-promotion-$GITHUB_RUN_ID"
          echo "DISCOVERY_DIR=$DISCOVERY_DIR" >> "$GITHUB_ENV"
          echo "PROMOTION_DIR=$PROMOTION_DIR" >> "$GITHUB_ENV"
          node scripts/workers/universal_catalog_discovery_v1.mjs \
            --as-of="$(date -u +%F)" \
            --out-dir="$DISCOVERY_DIR"

      - name: Apply only exact released incremental targets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workers/catalog_incremental_supervisor_v1.mjs \
            --mode=apply \
            --as-of="$(date -u +%F)" \
            --discovery-dir="$DISCOVERY_DIR" \
            --out-dir="$PROMOTION_DIR" \
            --expected-head-sha="$GITHUB_SHA" \
            --max-targets=5

      - name: Open or update promotion failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Promotion] Incremental supervisor failure';
            const body = `The governed incremental catalog supervisor failed or reached a bounded stop.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Close resolved promotion failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Promotion] Incremental supervisor failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, state: 'closed',
            });

      - name: Upload discovery and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-incremental-promotion-${{ github.run_id }}
          path: |
            ${{ env.DISCOVERY_DIR }}
            ${{ env.PROMOTION_DIR }}
          if-no-files-found: error
          retention-days: 90
