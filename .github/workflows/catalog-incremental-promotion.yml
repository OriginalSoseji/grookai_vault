name: Catalog Shadow Reconciliation

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-shadow-reconciliation-v1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on"
      CATALOG_AUTOMATION_MODE: shadow-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify shadow reconciliation contracts
        run: |
          node --check backend/catalog/catalog_shadow_automation_v1.mjs
          node --check backend/catalog/cross_tcg_set_publication_gate_v1.mjs
          node --check scripts/workers/catalog_shadow_reconciliation_v1.mjs
          node --check scripts/workers/cross_tcg_set_publication_gate_v1.mjs
          node --check scripts/workers/universal_catalog_discovery_v1.mjs
          node --test \
            tests/contracts/catalog_shadow_automation_v1.test.mjs \
            tests/contracts/cross_tcg_set_publication_gate_v1.test.mjs \
            tests/contracts/universal_catalog_discovery_v1.test.mjs
          git diff --check

      - name: Freeze current discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          DISCOVERY_DIR="$RUNNER_TEMP/catalog-discovery-$GITHUB_RUN_ID"
          SHADOW_DIR="$RUNNER_TEMP/catalog-shadow-$GITHUB_RUN_ID"
          echo "DISCOVERY_DIR=$DISCOVERY_DIR" >> "$GITHUB_ENV"
          echo "SHADOW_DIR=$SHADOW_DIR" >> "$GITHUB_ENV"
          node scripts/workers/universal_catalog_discovery_v1.mjs \
            --as-of="$(date -u +%F)" \
            --out-dir="$DISCOVERY_DIR"

      - name: Freeze candidates in the evidence-only shadow queue
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DISCOVERY_DIR/canonical_promotion_candidates.json"
          test -f "$DISCOVERY_DIR/pokemon_master_index_reconciliation.json"
          node scripts/workers/catalog_shadow_reconciliation_v1.mjs \
            --discovery-dir="$DISCOVERY_DIR" \
            --out-dir="$SHADOW_DIR" \
            --expected-head-sha="$GITHUB_SHA"

      - name: Reconcile catalog source availability issue
        uses: actions/github-script@v7
        env:
          DISCOVERY_DIR: ${{ env.DISCOVERY_DIR }}
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync(
              `${process.env.DISCOVERY_DIR}/summary.json`, 'utf8',
            ));
            const title = '[Catalog Discovery] Source lane unavailable';
            const failures = summary.source_failures || [];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (failures.length === 0) {
              if (existing) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              return;
            }
            const lanes = failures.map((failure) => `- ${failure.authority}: ${failure.failure_class}`).join('\n');
            const body = `Catalog discovery completed in degraded mode. Unavailable lanes were excluded rather than converted into false catalog gaps.\n\n${lanes}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Audit released sets through the publication gate
        id: set_publication_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PUBLICATION_GATE_DIR="$RUNNER_TEMP/set-publication-gate-$GITHUB_RUN_ID"
          echo "PUBLICATION_GATE_DIR=$PUBLICATION_GATE_DIR" >> "$GITHUB_ENV"
          set +e
          node scripts/workers/cross_tcg_set_publication_gate_v1.mjs \
            --out-dir="$PUBLICATION_GATE_DIR" \
            --expected-head-sha="$GITHUB_SHA"
          gate_status=$?
          set -e
          cat "$PUBLICATION_GATE_DIR/CROSS_TCG_SET_PUBLICATION_GATE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_status"

      - name: Open or update set publication gate issue
        if: ${{ steps.set_publication_gate.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Publication] Released set gate blocked';
            const body = `One or more released sets failed the game-scope, card, or self-hosted media contract. No canonical writer was dispatched.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Close resolved set publication gate issue
        if: ${{ steps.set_publication_gate.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Publication] Released set gate blocked';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, state: 'closed',
            });

      - name: Open or update shadow reconciliation failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Shadow] Reconciliation failure';
            const body = `The catalog shadow reconciliation failed closed. No canonical writer was dispatched.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Close resolved shadow reconciliation failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Catalog Shadow] Reconciliation failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, state: 'closed',
            });

      - name: Report evidence-only catalog candidates
        if: success()
        uses: actions/github-script@v7
        env:
          SHADOW_DIR: ${{ env.SHADOW_DIR }}
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync(
              `${process.env.SHADOW_DIR}/summary.json`, 'utf8',
            ));
            const count = Number(summary.counts?.shadow_promotion_candidate_count || 0);
            const title = '[Catalog Shadow] Canonical promotion candidate queue';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (count === 0) {
              if (existing) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              return;
            }
            const body = `${count} evidence-backed candidates are preserved in the latest ` +
              `shadow catalog. They are not canonical and no writer was dispatched.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Upload discovery and shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-shadow-reconciliation-${{ github.run_id }}
          path: |
            ${{ env.DISCOVERY_DIR }}
            ${{ env.SHADOW_DIR }}
            ${{ env.PUBLICATION_GATE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce released set publication gate
        if: ${{ always() && steps.set_publication_gate.outcome == 'failure' }}
        shell: bash
        run: exit 1
