name: One Piece Set Production Closure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read, image-prove, image-apply, activation-prove, activate, or verify
        required: true
        type: choice
        options:
          - audit
          - image-canary
          - image-apply
          - activation-canary
          - activate
          - verify
      set_code:
        description: Exact canonical One Piece set code
        required: true
        default: OP17
        type: string
      official_series_id:
        description: Bandai official card-list series ID
        required: true
        default: '569117'
        type: string
      expected_sha:
        description: Exact merged main commit SHA
        required: true
        type: string
      expected_snapshot_fingerprint:
        description: Exact prior snapshot fingerprint; empty only for audit
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: one-piece-set-production-closure-${{ inputs.set_code }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MODE: ${{ inputs.mode }}
      SET_CODE: ${{ inputs.set_code }}
      OFFICIAL_SERIES_ID: ${{ inputs.official_series_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_SNAPSHOT_FINGERPRINT: ${{ inputs.expected_snapshot_fingerprint }}

    steps:
      - name: Check out frozen main producer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify frozen boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=no)"
          [[ "$SET_CODE" =~ ^(OP|ST|EB|PRB)[0-9]{2}$ ]]
          [[ "$OFFICIAL_SERIES_ID" =~ ^[0-9]+$ ]]
          if [[ "$MODE" != "audit" ]]; then
            [[ "$EXPECTED_SNAPSHOT_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          fi
          if [[ "$MODE" == image-* ]]; then
            test -n "$SUPABASE_URL"
            test -n "$SUPABASE_SECRET_KEY"
          fi
          node --check backend/catalog/one_piece_set_release_closure_v1.mjs
          node --check scripts/workers/one_piece_set_release_closure_v1.mjs
          node --test tests/contracts/one_piece_set_release_closure_v1.test.mjs
          git diff --check

      - name: Execute exact closure mode
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/one-piece-set-closure-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          args=(
            "--mode=$MODE"
            "--set-code=$SET_CODE"
            "--official-series-id=$OFFICIAL_SERIES_ID"
            "--expected-head-sha=$EXPECTED_SHA"
            "--out-dir=$OUT_DIR"
          )
          if [[ "$MODE" != "audit" ]]; then
            args+=("--expected-snapshot-fingerprint=$EXPECTED_SNAPSHOT_FINGERPRINT")
          fi
          node scripts/workers/one_piece_set_release_closure_v1.mjs "${args[@]}"

      - name: Upload immutable closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-set-closure-${{ inputs.mode }}-${{ inputs.set_code }}-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
