name: Japanese V4 Image Pointer Rollback Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/japanese-v4-image-pointer-rollback-proof.yml
      - scripts/audits/japanese_master_index_v4/image_pointer_*.mjs
      - docs/audits/japanese_master_index_v4/image_pointer_plan_v1/**
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Frozen pointer package fingerprint
        required: true
        type: string
      pointer_plan_hash:
        description: Frozen pointer plan hash
        required: true
        type: string
      mutation_contract_hash:
        description: Frozen mutation contract hash
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: japanese-v4-image-pointer-rollback-proof
  cancel-in-progress: false

jobs:
  rollback-proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'catalog/jpn-v4-production-integration-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run exact rollback-only proof
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$SUPABASE_DB_URL"
          FINGERPRINT='${{ inputs.fingerprint }}'
          POINTER_PLAN_HASH='${{ inputs.pointer_plan_hash }}'
          MUTATION_CONTRACT_HASH='${{ inputs.mutation_contract_hash }}'
          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT='e76ecd6f12ad5c1a1a1f6836d54c34d527e4688f43d5196331aed31da93df912'
            POINTER_PLAN_HASH='0600e0de392dcf714b5a3450a6f05fd739e6b32092e9e46883c747c56bacf5be'
            MUTATION_CONTRACT_HASH='5f103aaabda1f04533426e6695b367460c29483e694b5909e233c6529778e6f9'
          fi
          node scripts/audits/japanese_master_index_v4/image_pointer_rollback_proof_v1.mjs \
            --execute-rollback-proof \
            --fingerprint="$FINGERPRINT" \
            --pointer-plan-hash="$POINTER_PLAN_HASH" \
            --mutation-contract-hash="$MUTATION_CONTRACT_HASH"

      - name: Upload rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-v4-image-pointer-rollback-proof
          path: docs/audits/japanese_master_index_v4/image_pointer_rollback_proof_v1/
          if-no-files-found: error
          retention-days: 30
