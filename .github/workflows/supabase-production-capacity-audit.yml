name: Supabase Production Capacity Audit (read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-production-capacity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ycdxbpibncqcchqiihfz
      SUPABASE_ORGANIZATION_SLUG: rksadomjkuoxvrbhsmxu
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit dependencies
        run: npm ci --ignore-scripts

      - name: Verify audit credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_URL"

      - name: Capture read-only database storage breakdown
        run: >-
          node scripts/audits/supabase_production_storage_breakdown_v1.mjs
          --output-dir audit-artifacts/supabase-production-capacity
          --limit 30

      - name: Run read-only capacity audit
        run: >-
          node scripts/audits/supabase_production_capacity_audit_v1.mjs
          --project-ref "$SUPABASE_PROJECT_REF"
          --organization-slug "$SUPABASE_ORGANIZATION_SLUG"
          --output-dir audit-artifacts/supabase-production-capacity
          --strict

      - name: Publish workflow summary
        if: always()
        run: |
          if [ -f audit-artifacts/supabase-production-capacity/STORAGE_BREAKDOWN.md ]; then
            cat audit-artifacts/supabase-production-capacity/STORAGE_BREAKDOWN.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f audit-artifacts/supabase-production-capacity/SUMMARY.md ]; then
            cat audit-artifacts/supabase-production-capacity/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-capacity-audit
          path: audit-artifacts/supabase-production-capacity
          if-no-files-found: error
          retention-days: 30

