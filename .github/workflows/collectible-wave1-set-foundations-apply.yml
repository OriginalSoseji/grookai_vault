name: Collectible Wave 1 Set Foundations Durable Apply

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact merged default-branch SHA to execute
        required: true
        type: string
      execution_acknowledgement:
        description: Must equal DURABLE_APPLY_505_HIDDEN_SETS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collectible-wave1-set-foundations-apply-v1
  cancel-in-progress: false

jobs:
  durable-apply:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NODE_OPTIONS: --use-system-ca
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXECUTION_ACKNOWLEDGEMENT: ${{ inputs.execution_acknowledgement }}
      GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TARGET_MIGRATION: "20260828063000"
      TARGET_MIGRATION_FILE: "20260828063000_collectible_wave1_set_foundations_v1.sql"

    steps:
      - name: Check out frozen commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify frozen durable boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$EXECUTION_ACKNOWLEDGEMENT" = "DURABLE_APPLY_505_HIDDEN_SETS"

      - name: Verify durable apply contracts
        run: |
          node --check backend/catalog/collectible_wave1_set_foundations_v1.mjs
          node --check scripts/audits/collectible_wave1_set_foundations_apply_v1.mjs
          node --check scripts/audits/collectible_wave1_set_foundations_rollback_v1.mjs
          node --test tests/contracts/collectible_wave1_set_foundations_v1.test.mjs
          git diff --check

      - name: Freeze exact apply plan and production preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/collectible-wave1-set-foundations-apply-$GITHUB_RUN_ID"
          CLI_DIR="$RUNNER_TEMP/collectible-wave1-set-foundations-cli-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "CLI_DIR=$CLI_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CLI_DIR"
          node scripts/audits/collectible_wave1_set_foundations_apply_v1.mjs \
            --prepare-apply \
            --expected-head-sha="$EXPECTED_HEAD_SHA" \
            --execution-acknowledgement="$EXECUTION_ACKNOWLEDGEMENT" \
            --out-dir="$OUT_DIR"

      - name: Prove only the frozen migration is pending
        id: cli_preflight
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.90.0 db push \
            --db-url "$SUPABASE_DB_URL" \
            --dry-run 2>&1 | tee "$CLI_DIR/pre_cli_dry_run.txt"
          node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const v=[...new Set(s.match(/\b20\d{12}(?=_|\b)/g)||[])].sort();if(JSON.stringify(v)!==JSON.stringify([process.env.TARGET_MIGRATION]))throw new Error(`pending migrations: ${JSON.stringify(v)}`);if(!s.includes(process.env.TARGET_MIGRATION))throw new Error("target migration missing");' "$CLI_DIR/pre_cli_dry_run.txt"

      - name: Apply the single frozen migration
        id: durable_apply
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.90.0 db push \
            --db-url "$SUPABASE_DB_URL" \
            --yes 2>&1 | tee "$CLI_DIR/apply_cli.txt"
          grep -q "$TARGET_MIGRATION" "$CLI_DIR/apply_cli.txt"

      - name: Prove migration queue is empty
        if: ${{ always() && steps.durable_apply.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.90.0 db push \
            --db-url "$SUPABASE_DB_URL" \
            --dry-run 2>&1 | tee "$CLI_DIR/post_cli_dry_run.txt"

      - name: Read back and independently reconcile durable state
        if: ${{ always() && steps.durable_apply.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audits/collectible_wave1_set_foundations_apply_v1.mjs \
            --post-apply-readback \
            --expected-head-sha="$EXPECTED_HEAD_SHA" \
            --execution-acknowledgement="$EXECUTION_ACKNOWLEDGEMENT" \
            --out-dir="$OUT_DIR" \
            --pre-dry-run-log="$CLI_DIR/pre_cli_dry_run.txt" \
            --apply-log="$CLI_DIR/apply_cli.txt" \
            --post-dry-run-log="$CLI_DIR/post_cli_dry_run.txt"

      - name: Upload durable apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectible-wave1-set-foundations-apply-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
