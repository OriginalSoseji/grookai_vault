name: Cross-TCG Set Cover Gap Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create frozen plans or apply those exact plans
        required: true
        type: choice
        options:
          - plan
          - apply
      lane:
        description: Exact independently atomic repair lane
        required: true
        type: choice
        options:
          - one_piece
          - mtg
      expected_sha:
        description: Exact merged main producer SHA
        required: true
        type: string
      expected_plan_fingerprint:
        description: Required for apply mode
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cross-tcg-set-cover-gap-repair-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CATALOG_AUTOMATION_MODE: shadow-only
      MODE: ${{ inputs.mode }}
      LANE: ${{ inputs.lane }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_PLAN_FINGERPRINT: ${{ inputs.expected_plan_fingerprint }}

    steps:
      - name: Check out frozen main producer
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify frozen repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=no)"
          if [[ "$MODE" == "apply" ]]; then
            [[ "$EXPECTED_PLAN_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          fi
          node --check scripts/audits/cross_tcg_set_cover_backfill_v1.mjs
          node --check scripts/audits/mtg_deck_package_cover_backfill_v1.mjs
          node --check scripts/workers/cross_tcg_set_publication_gate_v1.mjs
          node --test \
            tests/contracts/cross_tcg_set_browser_v1.test.mjs \
            tests/contracts/cross_tcg_set_publication_gate_v1.test.mjs \
            tests/contracts/mtg_deck_package_cover_policy_v1.test.mjs
          git diff --check

      - name: Execute exact One Piece cover repair
        if: ${{ inputs.lane == 'one_piece' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "--games=one_piece"
            "--replace"
            "--set-codes=don,eb02,eb03,eb04,op15,p"
          )
          if [[ "$MODE" == "apply" ]]; then
            args+=("--apply" "--expected-plan-fingerprint=$EXPECTED_PLAN_FINGERPRINT")
          fi
          node scripts/audits/cross_tcg_set_cover_backfill_v1.mjs "${args[@]}"

      - name: Execute exact MTG package repair
        if: ${{ inputs.lane == 'mtg' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "--set-codes=dvd,evg,gs1,gvl,h09,jvc,oe01,ohop,opc2,opca,pd2,pd3"
          )
          if [[ "$MODE" == "apply" ]]; then
            args+=("--apply" "--expected-plan-fingerprint=$EXPECTED_PLAN_FINGERPRINT")
          fi
          node scripts/audits/mtg_deck_package_cover_backfill_v1.mjs "${args[@]}"

      - name: Verify released-set publication after apply
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/set-publication-gate-$GITHUB_RUN_ID"
          echo "PUBLICATION_GATE_DIR=$out" >> "$GITHUB_ENV"
          node scripts/workers/cross_tcg_set_publication_gate_v1.mjs \
            --out-dir="$out" \
            --expected-head-sha="$EXPECTED_SHA"
          cat "$out/CROSS_TCG_SET_PUBLICATION_GATE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-tcg-set-cover-gap-repair-${{ inputs.lane }}-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            docs/audits/cross_tcg_set_cover_backfill_v1
            docs/audits/mtg_deck_package_cover_backfill_v1
            ${{ env.PUBLICATION_GATE_DIR }}
          if-no-files-found: error
          retention-days: 90
