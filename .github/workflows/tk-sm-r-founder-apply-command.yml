name: TK-SM-R Founder Apply Command

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish the phone item or execute one approved command
        required: true
        type: choice
        options:
          - publish_work_item
          - execute_approved_command

permissions:
  contents: read

concurrency:
  group: tk-sm-r-founder-apply-command-v1
  cancel-in-progress: false

jobs:
  bounded-command:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the approved command revision without leasing it
        id: resolve-command
        if: inputs.operation == 'execute_approved_command'
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/tk-sm-r-founder-executor-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          node scripts/workers/tk_sm_r_founder_command_resolver_v1.mjs \
            --out-dir="$OUT_DIR"

      - name: Check out the command's frozen source revision
        if: inputs.operation == 'execute_approved_command'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-command.outputs.source_commit_sha }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify immutable command contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          if [ "${{ inputs.operation }}" = "publish_work_item" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          else
            test -n "${{ steps.resolve-command.outputs.command_id }}"
            test "$(git rev-parse HEAD)" = "${{ steps.resolve-command.outputs.source_commit_sha }}"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          test -n "$PROD_SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          node --check backend/operations/tk_sm_r_founder_apply_v1.mjs
          node --check scripts/workers/tk_sm_r_founder_apply_publisher_v1.mjs
          node --check scripts/workers/tk_sm_r_founder_command_resolver_v1.mjs
          node --check scripts/workers/tk_sm_r_founder_command_executor_v1.mjs
          node --test \
            tests/contracts/founder_operations_command_center_v1.test.mjs \
            tests/contracts/tk_sm_r_hidden_set_executor_v1.test.mjs \
            tests/contracts/tk_sm_r_founder_apply_v1.test.mjs
          git diff --check

      - name: Publish one execution-specific phone item
        if: inputs.operation == 'publish_work_item'
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/tk-sm-r-founder-publisher-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          node scripts/workers/tk_sm_r_founder_apply_publisher_v1.mjs \
            --publish \
            --out-dir="$OUT_DIR"

      - name: Execute one approved frozen command
        if: inputs.operation == 'execute_approved_command'
        shell: bash
        env:
          TK_SM_R_EXPECTED_COMMAND_ID: ${{ steps.resolve-command.outputs.command_id }}
          TK_SM_R_EXPECTED_SOURCE_COMMIT: ${{ steps.resolve-command.outputs.source_commit_sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          node scripts/workers/tk_sm_r_founder_command_executor_v1.mjs \
            --run \
            --out-dir="$OUT_DIR"

      - name: Upload command evidence
        if: always() && env.OUT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: tk-sm-r-founder-command-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
