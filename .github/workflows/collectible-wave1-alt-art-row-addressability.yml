name: Collectible Wave 1 Alt Art Row Addressability

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: collectible-wave1-alt-art-row-addressability-v1
  cancel-in-progress: false

jobs:
  refine:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_AUTOMATION_MODE: shadow-only
      NODE_OPTIONS: --use-system-ca
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify refinement contracts
        run: |
          node --check backend/catalog/collectible_shadow_parser_wave1_v1.mjs
          node --check scripts/workers/collectible_shadow_parser_wave1_v1.mjs
          node --test tests/contracts/collectible_shadow_parser_wave1_v1.test.mjs
          git diff --check

      - name: Run frozen metadata-only refinement
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          OUT_DIR="$RUNNER_TEMP/collectible-wave1-alt-art-$GITHUB_RUN_ID"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          node scripts/workers/collectible_shadow_parser_wave1_v1.mjs \
            --out-dir="$OUT_DIR" \
            --expected-head-sha="$GITHUB_SHA" \
            --source-ids=yugioh_ygoprodeck_api_v7 \
            --emit-yugioh-alt-art-index \
            --max-response-bytes=134217728 \
            --request-timeout-ms=60000

      - name: Report refinement blockers
        if: always() && env.OUT_DIR != ''
        uses: actions/github-script@v8
        env:
          OUT_DIR: ${{ env.OUT_DIR }}
        with:
          script: |
            const fs = require('fs');
            const summaryPath = `${process.env.OUT_DIR}/summary.json`;
            if (!fs.existsSync(summaryPath)) return;
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const title = '[Collectible Wave 1 Alt Art] Blockers';
            const blocked = summary.failed_source_count !== 0 ||
              summary.validation_failure_count !== 0 ||
              summary.alternative_artwork_source_card_count !== 124;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (!blocked) {
              if (existing) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              return;
            }
            const body = `Source cards: ${summary.alternative_artwork_source_card_count}\n` +
              `Candidate references: ${summary.alternative_artwork_printing_candidate_reference_count}\n` +
              `Validation failures: ${summary.validation_failure_count}\n\n` +
              `No database, Storage, image, AI, pricing, publication, or Vault writes occurred.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            else await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });

      - name: Upload refinement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectible-wave1-alt-art-row-addressability-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
