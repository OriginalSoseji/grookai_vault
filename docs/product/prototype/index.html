<div class="banner" role="region" aria-label="Prototype status">INTERACTIVE PROTOTYPE · Sample data only · No connection to your Vault or payments</div>
<div class="shell"><aside class="sidebar"><a class="brand" href="#vault">grookai<span>.</span><small>YOUR CARDS. YOUR NEXT MOVE.</small></a><div class="mode"><button data-mode="collector">Collector</button><button data-mode="vendor">Vendor</button></div><nav id="side-nav" aria-label="Workspace"></nav><div class="sidefoot"><strong>One collection. Two workspaces.</strong>Switch tools without making another account.<p style="margin-top:22px">6-screen direction study<br>October 7, 2026</p></div></aside><div class="workspace"><header class="topbar"><span class="crumb" id="crumb">Collector / Vault</span><div class="mobilemode">grookai.<select id="mobile-mode" aria-label="Workspace mode"><option value="collector">Collector</option><option value="vendor">Vendor</option></select></div><div class="topactions"><select id="scenario" aria-label="Sample data scenario"><option value="populated">Populated</option><option value="empty">Empty</option><option value="review">Needs review</option></select><button class="reset quiet" onclick="resetDemo()" style="font-size:11px;padding:7px 10px">Reset demo</button><span class="avatar" role="img" aria-label="Sample account">GV</span></div></header><main id="main" class="content"></main></div></div><nav class="bottomnav" id="bottom-nav" aria-label="Workspace mobile"></nav><div id="toast" class="toast hidden" role="status"></div><dialog id="dialog"><div id="dialog-content"></div></dialog>
<script>
const icons={vault:'M4 5h16v15H4z M7 2h10v3 M8 10h8 M8 14h5',explore:'M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15 M16 16l6 6',scan:'M8 3H3v5 M16 3h5v5 M21 16v5h-5 M8 21H3v-5 M7 12h10',binders:'M4 3h14v18H4z M8 3v18 M18 6h3v15h-3',community:'M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3c0-3 12-3 12 0v3 M17 6a3 3 0 0 1 0 6 M18 16c4 0 4 3 4 5',desk:'M3 8h18v12H3z M7 8V3h10v5 M7 13h3 M14 13h3 M7 17h10',inventory:'M3 6l9-4 9 4v13l-9 3-9-3z M3 6l9 4 9-4 M12 10v12',reports:'M4 21V11h4v10 M10 21V3h4v18 M16 21V7h4v14',store:'M3 8l2-5h14l2 5v4H3z M5 12v9h14v-9 M9 21v-6h6v6'};
function icon(k){return `<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${icons[k]||icons.vault}"/></svg>`}const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[{id:'A01',name:'Pikachu',set:'Sample series · 001',finish:'Holo',condition:'NM',ask:48,market:52,cost:32,listed:true,color:'#dcc77e'},{id:'A02',name:'Pikachu',set:'Sample series · 001',finish:'Holo',condition:'LP',ask:44,market:52,cost:26,listed:false,color:'#dcc77e'},{id:'B01',name:'Charizard',set:'Sample series · 002',finish:'Holo',condition:'NM',ask:96,market:105,cost:null,listed:true,color:'#c9947f'},{id:'C01',name:'Gengar',set:'Sample series · 003',finish:'Reverse holo',condition:'NM',ask:18,market:20,cost:10,listed:false,color:'#a49bc6'}];
let state={mode:'collector',scenario:'populated',items:structuredClone(seed),cart:[],receipts:[{number:'DEMO-101',revenue:80,cost:52},{number:'DEMO-102',revenue:50,cost:32},{number:'DEMO-103',revenue:50,cost:null}],expenses:30,filter:'all',finish:'Holo',held:null,selected:'A01'};let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3800)}
function items(){if(state.scenario==='empty')return[];return state.items.map((c,i)=>state.scenario==='review'&&i===0?{...c,ask:null,market:null,finish:'Needs confirmation',cost:null}:c)}
function art(c){return `<div class="art" role="img" style="--art:${c.color}" aria-label="Abstract sample artwork for ${esc(c.name)}"><span class="artmark">✧</span><span class="artname">${esc(c.name)}<small>Concept artwork · sample only</small></span></div>`}function button(label,action,style='primary'){return `<button class="${style}" onclick="${action}">${label}</button>`}function hero(eyebrow,title,body,actions=''){return `<section class="hero"><div><span class="eyebrow">${eyebrow}</span><h1 id="main-title" tabindex="-1">${title}</h1><p>${body}</p></div><div class="actions">${actions}</div></section>`}function stat(label,value,note,featured=false){return `<div class="stat ${featured?'featured':''}"><small>${label}</small><strong>${value}</strong><small>${note}</small></div>`}function empty(title,body,actions){return `<section class="empty">${icon('vault')}<h2>${title}</h2><p>${body}</p><div class="actions">${actions}</div></section>`}
function route(){return location.hash.slice(1)||'vault'}function go(to){if(route()===to)render();else location.hash=to}function mode(to){state.mode=to;go(to==='vendor'?'desk':'vault')}function nav(){const vendor=state.mode==='vendor';const links=vendor?[['desk','Desk'],['inventory','Inventory'],['scan','Scan'],['reports','Reports'],['store','Store']]:[['vault','Vault'],['explore','Explore'],['scan','Scan'],['binders','Binders'],['community','Community']];const html=links.map(([id,label])=>`<a href="#${id}" class="navlink ${route()===id?'active':''}" ${route()===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span></a>`).join('');document.getElementById('side-nav').innerHTML=html;document.getElementById('bottom-nav').innerHTML=html;document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.mode===state.mode);b.onclick=()=>mode(b.dataset.mode)});document.getElementById('mobile-mode').value=state.mode;document.getElementById('crumb').textContent=`${vendor?'Vendor':'Collector'} / ${route()[0].toUpperCase()+route().slice(1)}`}
function vault(){const rows=items(),known=rows.filter(c=>c.market!=null),cost=rows.filter(c=>c.cost!=null);return hero('YOUR COLLECTION','Room for your next favorite.','Understand what you own, find what is missing, and make the next move.',button('+ Add cards',"go('scan')")+button('Find a card',"go('explore')",'quiet'))+`<div class="stats">${stat('Reference value',money(known.reduce((s,c)=>s+c.market,0)),`${known.length}/${rows.length} copies have an example reference`,true)}${stat('Physical copies',rows.length,'Each copy keeps its own identity')}${stat('Known acquisition cost',money(cost.reduce((s,c)=>s+c.cost,0)),`${cost.length}/${rows.length} copies have a cost`)}${stat('Ready for your next move',rows.filter(c=>c.listed).length,'Copies explicitly offered for sale')}</div>`+(rows.length?`<div class="twocol"><section class="panel"><div class="panelhead"><h2>Recently in your Vault</h2><a href="#inventory" onclick="state.mode='vendor'">Manage copies →</a></div><div class="cards">${rows.filter((c,i,a)=>a.findIndex(x=>x.name===c.name)===i).slice(0,3).map(c=>`<button class="cardtile" onclick="research('${c.id}')">${art(c)}<h3>${c.name}</h3><small>${c.set}</small><div class="cardmeta"><strong>${c.market==null?'No reference':money(c.market)}</strong><span class="tag">${rows.filter(x=>x.name===c.name).length} ${rows.filter(x=>x.name===c.name).length===1?'copy':'copies'}</span></div></button>`).join('')}</div></section><section class="panel"><div class="panelhead"><h2>Pick up where you left off</h2></div><div class="nextstep"><span class="stepnum">01</span><div class="grow"><h3>Make your inventory complete</h3><p>${rows.length-cost.length} copies need acquisition cost.</p></div><button onclick="state.mode='vendor';state.filter='cost';go('inventory')">Review</button></div><div class="nextstep"><span class="stepnum">02</span><div class="grow"><h3>Keep building your collection</h3><p>Find the next card, then choose its exact printing.</p></div><button onclick="go('explore')">Explore</button></div><div class="nextstep"><span class="stepnum">03</span><div class="grow"><h3>Ready for a show?</h3><p>Your collection also powers your vendor workspace.</p></div><button onclick="mode('vendor')">Open</button></div><div class="notice">Value is a reference, not a sale promise. Missing prices stay visible.</div></section></div>`:empty('Your first card starts the story.','Scan a card or find it in the catalog. You can add a cost now or later.',button('Scan a card',"go('scan')")+button('Explore cards',"go('explore')",'quiet')))}
function research(id){state.selected=id;go('explore')}function explore(){const c=items().find(x=>x.id===state.selected)||seed[0];const missing=state.scenario==='review';return hero('EXPLORE / CARD RESEARCH',c.name,'Exact printing first. Price evidence next. Your copies stay distinct.',button('Add to Vault',"go('scan')")+button('Watch price',"toast('Proposed opt-in alert flow; no alert has been created.')",'quiet'))+`<div class="research">${art(c)}<div><div class="actions"><span class="tag">${c.set}</span><span class="tag">${missing?'Printing needs review':c.finish}</span></div><section class="panel" style="margin-top:18px"><span class="eyebrow">MARKET REFERENCE · USD</span><div class="price">${missing?'Not available':money(c.market||52)}</div><p class="muted" style="font-size:13px">${missing?'Confirm the exact printing before using a market reference.':'Sample source · Observed 7 Oct 2026 · Illustrative data'}</p>${missing?`<div class="notice">A similar card is not a substitute for the printing you own.</div>${button('Review printing',"go('scan')")}`:`<svg class="chart" viewBox="0 0 600 125" role="img" aria-label="Illustrative reference trend, not real market history"><path d="M0 100L40 90 80 97 120 78 160 84 200 65 240 72 280 48 320 59 360 42 400 46 440 29 480 34 520 18 560 25 600 10V125H0Z" fill="#e8f1da"/><path d="M0 100L40 90 80 97 120 78 160 84 200 65 240 72 280 48 320 59 360 42 400 46 440 29 480 34 520 18 560 25 600 10" fill="none" stroke="#597c3f" stroke-width="3"/></svg><div class="pricefacts"><div><small>Identity</small><strong>Exact printing</strong></div><div><small>History</small><strong>Sample series</strong></div><div><small>Asking price</small><strong>Your choice</strong></div></div>`}</section><section class="panel"><div class="panelhead"><h2>Your physical copies</h2><span class="tag">Private details</span></div>${items().filter(x=>x.name===c.name).map(x=>`<div class="nextstep"><div class="grow"><h3>${x.condition} · ${x.finish}</h3><p>GVVI-DEMO-${x.id} · Cost ${x.cost==null?'unknown':money(x.cost)}</p></div><button onclick="state.mode='vendor';go('inventory');setTimeout(()=>editCopy('${x.id}'),0)">Manage</button></div>`).join('')||'<p class="muted">No owned copies in this sample view.</p>'}</section></div></div>`}
function inventory(){const rows=items();return hero('VENDOR / INVENTORY','Know every copy.','Price, condition, cost and availability. No wall of forms.',button('+ Add cards',"go('scan')")+button('Open Desk',"go('desk')",'quiet'))+`<div class="toolbar"><input class="search" placeholder="Find a card, set or copy ID" aria-label="Search inventory" oninput="filterRows(this.value)"><div class="chips">${[['all','All copies'],['unpriced','Needs price'],['cost','Missing cost']].map(([v,l])=>`<button class="${state.filter===v?'active':''}" onclick="state.filter='${v}';render()">${l}</button>`).join('')}</div></div>`+(rows.length?`<div class="rows"><div class="tablehead"><span></span><span>Card / physical copy</span><span>Asking</span><span class="market">Reference</span><span class="status">Status</span><span></span></div>${rows.filter(c=>state.filter==='unpriced'?c.ask==null:state.filter==='cost'?c.cost==null:true).map(c=>`<article class="row" data-search="${esc((c.name+' '+c.set+' '+c.id).toLowerCase())}">${art(c)}<div><strong>${c.name}</strong><small>${c.set} · ${c.finish}</small><small>${c.condition} · GVVI-DEMO-${c.id}</small>${c.cost==null?'<span class="tag warn">Cost unknown</span>':''}</div><div class="pricecell"><small>Asking</small><span class="money">${c.ask==null?'Set price':money(c.ask)}</span></div><div class="market"><small>Sample reference</small><span>${c.market==null?'Unavailable':money(c.market)}</span></div><div class="status"><span class="tag ${c.listed?'green':''}">${c.listed?'Listed':'Private'}</span></div><button class="rowaction" onclick="editCopy('${c.id}')">Edit</button></article>`).join('')}</div><p class="footer-note">Each row is one physical copy. Price edits and public listing are deliberate choices in this proposed flow.</p>`:empty('Make room for your first sale.','Add an exact copy to your Vault. It stays private until you choose to offer it.',button('Add a card',"go('scan')")))}
function filterRows(q){document.querySelectorAll('[data-search]').forEach(el=>el.hidden=!el.dataset.search.includes(q.toLowerCase()))}
function editCopy(id){const c=state.items.find(x=>x.id===id);openDialog(`<header><h2>Edit this copy</h2><button onclick="closeDialog()" aria-label="Close editor">×</button></header><p><strong>${c.name}</strong> · ${c.condition}</p><p class="muted" style="font-size:12px;margin-bottom:20px">GVVI-DEMO-${c.id}</p><div class="formgrid"><label>Asking price (USD)<input id="edit-price" type="number" min="0.01" step="0.01" value="${c.ask||''}"></label><label>Private cost (optional)<input id="edit-cost" type="number" min="0" step="0.01" value="${c.cost??''}"></label></div><label style="display:flex;align-items:center;margin-top:20px"><input id="edit-list" type="checkbox" ${c.listed?'checked':''} style="width:auto">Offer this copy for sale</label><p class="footer-note">Private cost is never shown in customer view.</p><div class="actions">${button('Save sample copy',`saveCopy('${id}')`)}</div><p id="form-error" role="alert"></p>`)}function saveCopy(id){const pv=document.getElementById('edit-price').value.trim(),p=pv===''?null:Number(pv),listed=document.getElementById('edit-list').checked,v=document.getElementById('edit-cost').value,cost=v===''?null:Number(v);if((listed&&p===null)||(p!==null&&(!Number.isFinite(p)||p<=0))||(cost!==null&&(!Number.isFinite(cost)||cost<0))){document.getElementById('form-error').textContent='Offering a copy requires a positive asking price. Private copies can remain unpriced.';return}Object.assign(state.items.find(x=>x.id===id),{ask:p,cost,listed});closeDialog();render();toast('Sample copy updated. No live inventory changed.')}
function scan(){return hero('SCAN / CONFIRM','A good match deserves a quick check.','Confirm the printing and condition before adding a physical copy.')+`<div class="scansteps"><span>1 · Identify</span><span class="active">2 · Confirm</span><span>3 · Continue</span></div><div class="twocol"><section class="panel"><div class="panelhead"><h2>Review the sample match</h2><span class="tag ${state.scenario==='review'?'warn':'green'}">${state.scenario==='review'?'Printing uncertain':'Card matched'}</span></div><div class="reviewcard">${art(seed[0])}<div><h2>Pikachu</h2><p class="muted">Sample series · 001</p><div class="notice">${state.scenario==='review'?'Two finishes look similar. Choose the one you can see.':'Camera and label input will use the existing identification flow. This sample is simulated.'}</div><label>Exact printing</label><div class="finish">${['Holo','Reverse holo'].map(v=>`<button aria-pressed="${state.finish===v}" onclick="state.finish='${v}';render()">${v}</button>`).join('')}</div><div class="formgrid"><label>Condition<select id="scan-condition"><option>NM</option><option>LP</option><option>MP</option><option>HP</option><option>DMG</option></select></label><label>Known cost (USD)<input id="scan-cost" inputmode="decimal" placeholder="Optional"></label><label>Destination<select id="scan-destination"><option value="vault">My Vault · private</option><option value="deal" ${state.mode==='vendor'?'selected':''}>Current deal</option></select></label><label>Price (optional for Vault)<input id="scan-price" inputmode="decimal" placeholder="Optional for a private copy"></label></div><div class="actions" style="margin-top:24px">${button('Confirm sample copy',"confirmScan()")}${button('Different card',"go('explore')",'quiet')}</div><p id="scan-error" role="alert"></p></div></div></section><section class="panel"><h2>What saves with the card</h2><div class="nextstep"><span class="stepnum">✓</span><div><h3>One physical identity</h3><p>Your copy gets a durable ID for inventory and deals.</p></div></div><div class="nextstep"><span class="stepnum">✓</span><div><h3>Your details stay yours</h3><p>Condition, cost and asking price belong to this copy.</p></div></div><div class="nextstep"><span class="stepnum">✓</span><div><h3>Keep the session moving</h3><p>Continue collecting or return to the same deal.</p></div></div></section></div>`}
function confirmScan(){const dest=document.getElementById('scan-destination').value,pv=document.getElementById('scan-price').value.trim(),price=pv===''?null:Number(pv),cv=document.getElementById('scan-cost').value,cost=cv===''?null:Number(cv);if(!state.finish||(dest==='deal'&&price===null)||(price!==null&&(!Number.isFinite(price)||price<=0))||(cost!==null&&(!Number.isFinite(cost)||cost<0))){document.getElementById('scan-error').textContent='Choose a printing and valid amounts. A current deal requires a price.';return}const c={...seed[0],id:'N'+(state.items.length+1),finish:state.finish,condition:document.getElementById('scan-condition').value,cost,ask:price,listed:false};state.items.push(c);state.scenario='populated';document.getElementById('scenario').value='populated';if(dest==='deal'){state.mode='vendor';state.cart.push({...c,unit:price});go('desk')}else{state.mode='collector';go('vault')}toast('Sample copy added to this prototype only.')}
function desk(){const rows=items();return hero('VENDOR / DESK','Ready for the next deal.','One working deal, from the first copy to the receipt.',button('Scan cards',"go('scan')")+button(state.held?'Resume held deal':'Hold this deal',"holdDeal()",'quiet'))+`<div class="split"><section><div class="toolbar"><input class="search" aria-label="Search desk stock" placeholder="Search your stock" oninput="filterRows(this.value)"><span class="tag">${rows.length} available copies</span></div>${rows.length?`<div class="rows">${rows.map(c=>`<article class="row" style="grid-template-columns:45px minmax(100px,1fr) 80px" data-search="${esc(c.name.toLowerCase())}">${art(c)}<div><strong>${c.name}</strong><small>${c.condition} · ${c.finish}</small><small>GVVI-DEMO-${c.id}</small></div><div><strong>${c.ask==null?'Set price':money(c.ask)}</strong><button style="margin-top:6px" ${state.cart.some(x=>x.id===c.id)?'disabled':''} onclick="addDeal('${c.id}')">${state.cart.some(x=>x.id===c.id)?'In deal':'Add'}</button></div></article>`).join('')}</div>`:empty('Stock can start with one card.','Scan a card and review its exact identity before adding it to the deal.',button('Scan a sample',"go('scan')"))}<p class="footer-note">Adding a copy to a deal does not reserve online inventory. Availability is checked again at completion.</p></section><aside class="deal" id="current-deal" tabindex="-1" aria-label="Current deal"><div class="panelhead"><h2>Your deal</h2><span class="tag">Walk-up</span></div>${state.held?'<div class="hold">One held sample deal is ready to resume.</div>':''}${state.cart.map(c=>`<div class="dealitem"><div><strong>${c.name}</strong><small>${c.condition} · DEMO-${c.id}</small><button onclick="state.cart=state.cart.filter(c=>c.id!=='${c.id}');render()">Remove</button></div><strong>${money(c.unit)}</strong></div>`).join('')||'<p class="muted" style="font-size:13px;padding:25px 0">Add a physical copy to start. The deal stays here while you inspect a card.</p>'}<div style="margin-top:20px"><div class="totalrow"><span>Item sales</span><span>${money(total())}</span></div><div class="totalrow"><span>Tax in this sample</span><span>$0.00</span></div><div class="totalrow grand"><span>Customer pays</span><span>${money(total())}</span></div></div><button class="primary full" ${state.cart.length?'':'disabled'} onclick="reviewDeal()">Review deal →</button><button class="textbutton full" ${state.cart.length?'':'disabled'} onclick="customerView()">Open customer view</button><p class="footer-note">Cash or an external terminal. This prototype does not collect money.</p></aside></div><button class="deal-jump primary" onclick="document.getElementById('current-deal').scrollIntoView();document.getElementById('current-deal').focus({preventScroll:true})"><span>View deal · ${state.cart.length} copies</span><strong>${money(total())}</strong></button>`}
function total(){return state.cart.reduce((s,c)=>s+c.unit,0)}function addDeal(id){const c=items().find(x=>x.id===id);if(state.cart.some(x=>x.id===id))return;if(c.ask==null){toast('Set this exact copy’s price before adding it.');state.filter='unpriced';go('inventory');return}state.cart.push({...c,unit:c.ask});render();toast('Added to the same sample deal.')}
function holdDeal(){if(state.held){if(state.cart.length){toast('Keep the current deal empty before resuming this sample.');return}state.cart=state.held;state.held=null}else{if(!state.cart.length){toast('Add a copy before holding a deal.');return}state.held=state.cart;state.cart=[]}render()}
function reviewDeal(){openDialog(`<header><h2>Review before recording</h2><button onclick="closeDialog()" aria-label="Close deal review">×</button></header>${state.cart.map(c=>`<div class="totalrow"><span>${c.name} · ${c.condition}</span><strong>${money(c.unit)}</strong></div>`).join('')}<div class="totalrow grand"><span>Customer pays</span><span>${money(total())}</span></div><label>Recorded payment method<select id="payment"><option>Cash</option><option>Card · external terminal</option></select></label><div class="notice">Demo only. The live workflow must recover uncertain submissions through its existing receipt authority.</div><button class="primary full" onclick="recordDeal()">Record sample sale once</button>`)}
function recordDeal(){if(!state.cart.length)return;const number='DEMO-'+(104+state.receipts.length-3),sold=state.cart.map(c=>c.id),revenue=total(),cost=state.cart.every(c=>c.cost!=null)?state.cart.reduce((s,c)=>s+c.cost,0):null;state.receipts.push({number,revenue,cost});state.items=state.items.filter(c=>!sold.includes(c.id));state.cart=[];closeDialog();render();openDialog(`<header><h2>Sample sale recorded</h2><button onclick="closeDialog()" aria-label="Close sample receipt">×</button></header><span class="tag green">${number}</span><div class="price">${money(revenue)}</div><p>The sample copies have left available inventory. This is not a live receipt or payment.</p><div class="actions">${button('View results',"closeDialog();go('reports')")}${button('Next deal',"closeDialog();go('desk')",'quiet')}</div>`)}
function customerView(){openDialog(`<header><h2>Your deal</h2><button onclick="closeDialog()" aria-label="Close customer view">×</button></header>${state.cart.map(c=>`<div class="totalrow"><span>${c.name} · ${c.condition}</span><strong>${money(c.unit)}</strong></div>`).join('')}<div class="totalrow grand"><span>You pay</span><span>${money(total())}</span></div><p class="muted">Sample deal preview · Payment not confirmed</p>`)}
function reports(){const receipts=state.scenario==='empty'?[]:state.receipts,known=receipts.filter(r=>r.cost!=null),sales=receipts.reduce((s,r)=>s+r.revenue,0),margin=known.reduce((s,r)=>s+r.revenue-r.cost,0),unknown=receipts.filter(r=>r.cost==null).reduce((s,r)=>s+r.revenue,0);return hero('VENDOR / REPORTS','Close the day with clarity.','Revenue, costs and what you still need to reconcile.',button('Back to Desk',"go('desk')",'quiet'))+`<div class="notice"><strong>Proposed event reporting.</strong> This prototype illustrates known-cost economics. The implemented Reports entry currently reads existing sales totals; event expenses and profit are a later release.</div>`+(receipts.length?`<div class="stats">${stat('Recorded item sales',money(sales),`${receipts.length} sample transactions`,true)}${stat('Known-cost margin',money(margin),`${known.length}/${receipts.length} transactions have complete cost`)}${stat('Event expenses',money(state.expenses),'Sample table fee and travel')}${stat('Known-cost result',money(margin-state.expenses),'Partial result, not full-event profit')}</div><div class="twocol"><section class="panel"><div class="panelhead"><h2>Transaction history</h2><span class="tag">Sample show · 7 Oct</span></div><table class="ledger"><thead><tr><th>Receipt</th><th>Sales</th><th>Cost</th><th>Margin</th></tr></thead><tbody>${receipts.map(r=>`<tr><td>${r.number}</td><td>${money(r.revenue)}</td><td>${r.cost==null?'<span class="tag warn">Unknown</span>':money(r.cost)}</td><td>${r.cost==null?'—':money(r.revenue-r.cost)}</td></tr>`).join('')}</tbody></table><p class="footer-note">Recorded item sales are not processor settlements. This sample excludes tax, refunds and online orders.</p></section><section class="panel"><h2>Finish reconciling</h2><div class="progress"><span style="width:${known.length/receipts.length*100}%"></span></div><p><strong>${known.length} of ${receipts.length}</strong> transactions have complete cost.</p><div class="notice">${money(unknown)} in revenue has unknown cost. It is excluded from the known-cost margin, so the result is incomplete.</div><label>Sample event expenses (USD)<input id="expenses" type="number" min="0" step="0.01" value="${state.expenses}"></label><button class="primary full" style="margin-top:14px" onclick="saveExpenses()">Update sample expenses</button></section></div>`:empty('Your first receipt starts the report.','Record a sample deal to see its inventory and report result. Empty data never becomes invented profit.',button('Open Desk',"go('desk')")))}function saveExpenses(){const value=Number(document.getElementById('expenses').value);if(!Number.isFinite(value)||value<0){toast('Enter a valid expense amount.');return}state.expenses=value;render();toast('Sample expense updated.')}
function beyond(name){return hero('EXISTING WORKFLOW',name,'This six-screen prototype focuses on collecting a card and completing a vendor deal.')+empty('Keep the working product connected.','Binders, community and store administration keep their existing authorities. Their detailed redesign follows this first workflow slice.',button('Back to Vault',"mode('collector')")+button('Open Desk',"mode('vendor')",'quiet'))}
function render(){const r=route();if(['desk','inventory','reports','store'].includes(r))state.mode='vendor';if(['vault','explore','binders','community'].includes(r))state.mode='collector';nav();const pages={vault,explore,scan,desk,inventory,reports,binders:()=>beyond('Binders'),community:()=>beyond('Community'),store:()=>beyond('Your store')};document.getElementById('main').innerHTML=(pages[r]||vault)()+`<p class="demo-scope">Grookai product direction · Interactive sample only. No live inventory, camera, alerts or payments.</p>`}function openDialog(html){document.getElementById('dialog-content').innerHTML=html;document.getElementById('dialog').showModal()}function closeDialog(){document.getElementById('dialog').close()}function resetDemo(){state.items=structuredClone(seed);state.cart=[];state.held=null;state.scenario='populated';state.receipts=[{number:'DEMO-101',revenue:80,cost:52},{number:'DEMO-102',revenue:50,cost:32},{number:'DEMO-103',revenue:50,cost:null}];state.expenses=30;state.filter='all';document.getElementById('scenario').value='populated';render();toast('Sample data reset.')}
document.getElementById('mobile-mode').onchange=e=>mode(e.target.value);document.getElementById('scenario').onchange=e=>{state.scenario=e.target.value;state.filter='all';if(e.target.value==='review')state.finish='';render()};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.getElementById('main-title')?.focus({preventScroll:true})});render();
</script></body></html>
